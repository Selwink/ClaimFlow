<body>

<div id="gate" hidden></div>

<header class="brandbar">
  <div class="brandbar-inner gutter">
    <div class="mark">
      <span class="wordmark">medipoint</span>
    </div>
    <span class="divider" aria-hidden="true"></span>
    <div class="site">
      <h1>Garantieclaims</h1>
      <p id="vestiging">Vestiging Meppel</p>
    </div>
    <span class="sync" id="sync"></span>
    <span class="rol-label" id="rolLabel" hidden></span>
  </div>
  <div class="topnav gutter">
    <nav class="tabbar" aria-label="Hoofdmenu">
      <div class="menu">
        <button type="button" id="menuBtn" aria-expanded="false" aria-haspopup="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></button>
        <div class="menupaneel" id="menuPaneel" hidden>
          <span class="menu-kop">Exporteren</span>
          <button type="button" class="menu-item" data-menu="csv">Naar Excel (CSV)</button>
          <button type="button" class="menu-item" data-menu="afdrukken">Afdrukken / PDF</button>
          <button type="button" class="menu-item" data-menu="agenda">Herinneringen in agenda</button>
          <span class="menu-scheiding" aria-hidden="true"></span>
          <span class="menu-kop">Gegevens</span>
          <button type="button" class="menu-item" data-menu="backup">Back-up downloaden</button>
          <button type="button" class="menu-item" data-menu="terugzetten">Back-up terugzetten</button>
          <span class="menu-scheiding" aria-hidden="true"></span>
          <span class="menu-kop">App</span>
          <button type="button" class="menu-item" data-menu="installeren" id="installItem">App installeren</button>
          <button type="button" class="menu-item" data-menu="instellingen">Instellingen</button>
          <button type="button" class="menu-item" data-menu="thema" id="themaItem">Thema: donker</button>
          <button type="button" class="menu-item" data-menu="uitleg">Uitleg</button>
          <button type="button" class="menu-item" data-menu="updates">Updates</button>
          <span class="menu-scheiding" aria-hidden="true" id="uitlogScheiding" hidden></span>
          <button type="button" class="menu-item" data-menu="beheer" id="beheerItem" hidden>Inloggen als beheerder</button>
          <button type="button" class="menu-item" data-menu="uitloggen" id="uitlogItem" hidden>Uitloggen</button>
          <span class="menu-voet">Made by <b>Selwin</b></span>
        </div>
      </div>
      <button type="button" data-view="lijst" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 4.4 3.4 8.3 8 9 4.6-.7 8-4.6 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg><span>Claims</span></button>
      <button type="button" data-view="rapport" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Rapportage</span></button>
    </nav>
  </div>
  <div class="strip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
</header>

<main class="gutter app">
  <p class="printkop" id="printkop"></p>
  <div class="actieknoppen" id="actieknoppen">
    <button type="button" class="grote-knop" id="addBtn"><span class="plus" aria-hidden="true">+</span>Claim toevoegen</button>
  </div>
  <div class="zoekveld">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <input type="search" id="q" placeholder="Zoek claims" aria-label="Zoek op nummer, type, onderdeel, storing of leverancier">
  </div>
  <nav class="periods" id="periods" aria-label="Periode"></nav>
  <div id="banner" class="banner" hidden></div>

  <div id="lijstweergave">
    <div id="dagmelding"></div>
    <div class="teller" id="teller" role="tablist" aria-label="Status"></div>
    <div class="lijstkop" id="lijstkop">
      <span class="lk-titel" id="lijstTitel"></span>
      <span class="lk-knoppen">
        <button type="button" class="klein-knop" id="filterBtn" aria-expanded="false" aria-controls="filters">Filters</button>
        <button type="button" class="klein-knop" id="selectBtn" aria-pressed="false">Selecteren</button>
      </span>
    </div>
    <div class="filters" id="filters" hidden>
      <select id="fLev" aria-label="Leverancier"></select>
      <select id="fLoc" aria-label="Binnen- of buitenmonteur">
        <option value="">Alle monteurs</option>
        <option value="binnen">Binnenmonteurs</option>
        <option value="buiten">Buitenmonteurs</option>
      </select>
      <select id="fUit" aria-label="Uitbesteed">
        <option value="">Uitbesteed en eigen</option>
        <option value="ja">Alleen uitbesteed</option>
        <option value="nee">Zonder uitbesteed</option>
      </select>
      <select id="fGroep" aria-label="Groeperen">
        <option value="maand">Per maand</option>
        <option value="leverancier">Per leverancier</option>
        <option value="geen">Alles op één hoop</option>
      </select>
      <select id="fSort" aria-label="Sorteren">
        <option value="standaard">Openstaand eerst</option>
        <option value="ouderdom">Langst openstaand</option>
        <option value="bedrag">Hoogste bedrag</option>
        <option value="leverancier">Leverancier A–Z</option>
        <option value="onderdeel">Onderdeel A–Z</option>
        <option value="bijgewerkt">Laatst bijgewerkt</option>
        <option value="inkoop">Inkoopnummer</option>
        <option value="status">Status</option>
        <option value="periode">Nieuwste periode</option>
      </select>
      <button type="button" class="linkbtn" id="wisFilters">Filters wissen</button>
    </div>
    <section class="list" id="list"></section>
    <div class="trashbar"><button type="button" class="btn btn-ghost" id="trashBtn" hidden></button></div>
  </div>

  <div id="rapportweergave" class="rapport" hidden></div>
</main>

<div class="onderbalk" id="onderbalk">
  <div class="bulkbalk" id="bulkbalk" hidden></div>
</div>

<script>
(function(){
  "use strict";

  /* ======================================================================
     INSTELLINGEN
     - SUPABASE_URL / SUPABASE_KEY: Project Settings -> API in Supabase.
       Laat ze leeg en de app bewaart alles alleen in deze browser.
     - ACCOUNTS: false = één gedeeld wachtwoord (WACHTWOORD_HASH), zoals
       versie 1. true = iedereen logt in met een eigen Supabase-account
       (e-mail + wachtwoord). Alleen met true en de beveiliging uit
       supabase-beveiliging.sql zijn de claims echt afgeschermd.
     - WACHTWOORD_HASH: sha256 van (wachtwoord + "medipoint-meppel").
       Een nieuwe maak je in Menu -> Instellingen -> Wachtwoord-hash maken.
     ====================================================================== */
  const CONFIG = {
    SUPABASE_URL: "https://xpktjqdtwmqznhgcicim.supabase.co",
    SUPABASE_KEY: "sb_publishable_Pg8KNp50y2EzGkYurn117w_4Llr27bI",
    TABEL: "claims",
    ACCOUNTS: false,
    WACHTWOORD_HASH: "1360561d88563bcbd4716c3e1dc928fc6275afe52d64e830ef5c025446d567a9",
    // Beheerderswachtwoord: alleen hiermee kun je claims toevoegen, aanpassen en verwijderen.
    // Met het gewone wachtwoord kun je alleen kijken. Leeg = iedereen met het gewone wachtwoord mag alles.
    BEHEER_HASH: ""
  };
  /* ===================================================================== */

  const BASE = String(CONFIG.SUPABASE_URL || "").replace(/\/+$/, "");
  const KEY = CONFIG.SUPABASE_KEY || "";
  const REMOTE = !!(BASE && KEY);
  const API = REMOTE ? BASE + "/rest/v1/" + CONFIG.TABEL : "";
  const ZOUT = "medipoint-meppel";
  const LGAR_FORMULIER = "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=lNlTLdkSZ06NbuTxZ3lQ-h5l1KWN4khFmEPmfPxlgCFUN1NQU003VEEwTzBZQjg1ODhIMVZVUUNFVyQlQCN0PWcu";

  /* ---------- kleine hulpjes ---------- */
  const el = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const ls = {
    get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } },
    del(k){ try{ localStorage.removeItem(k); }catch(e){} },
    json(k){ try{ return JSON.parse(localStorage.getItem(k) || "null"); }catch(e){ return null; } }
  };
  const MONTHS = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
  const euro = n => "€ " + (Number(n) || 0).toLocaleString("nl-NL", {minimumFractionDigits:2, maximumFractionDigits:2});
  const euroKort = n => "€ " + Math.round(Number(n) || 0).toLocaleString("nl-NL");
  const isPeriode = p => /^\d{4}-\d{2}$/.test(p || "");
  const periodLabel = p => {
    if(!isPeriode(p)) return "Zonder periode";
    const [y, m] = p.split("-");
    return MONTHS[Number(m) - 1].replace(/^./, c => c.toUpperCase()) + " " + y;
  };
  const periodShort = p => {
    if(!isPeriode(p)) return "Overig";
    const [y, m] = p.split("-");
    return MONTHS[Number(m) - 1].slice(0, 3).replace(/^./, c => c.toUpperCase()) + " '" + y.slice(2);
  };
  const vandaag = () => {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  };
  const thisPeriod = () => vandaag().slice(0, 7);
  const DAY = 86400000;
  const dag = iso => { const d = new Date(String(iso).slice(0, 10) + "T00:00:00"); return isNaN(d) ? null : d; };
  const dagenTussen = (a, b) => Math.max(0, Math.round((dag(b) - dag(a)) / DAY));
  function fmtDate(iso){
    const d = iso ? dag(iso) : null;
    return d ? d.toLocaleDateString("nl-NL", {day:"numeric", month:"short", year:"numeric"}) : "";
  }
  const meervoud = (n, een, veel) => n + " " + (n === 1 ? een : veel);
  const nieuwId = () => (crypto.randomUUID ? crypto.randomUUID() : "c" + Date.now() + Math.random().toString(36).slice(2, 8));
  async function sha(tekst){
    if(!(window.crypto && crypto.subtle)) return null;
    const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(tekst));
    return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  function parseAmount(v){
    if(String(v || "").trim() === "") return null;
    const s = String(v).replace(/[^\d,.-]/g, "").replace(/\.(?=\d{3}\b)/g, "").replace(",", ".");
    const n = parseFloat(s);
    return isNaN(n) ? null : n;
  }

  /* ---------- statussen ---------- */
  const STATUS = {
    nieuw:       {label:"Nieuw"},
    ingediend:   {label:"Ingediend"},
    gehonoreerd: {label:"Gehonoreerd"},
    afgewezen:   {label:"Afgewezen"}
  };
  const statusVan = c => STATUS[c.status] ? c.status : "nieuw";
  const isOpen = c => statusVan(c) === "nieuw" || statusVan(c) === "ingediend";
  const geenBedrag = c => c.bedrag == null || c.bedrag === "" || Number(c.bedrag) === 0;
  const aankoopVan = c => (c.aankoop && String(c.aankoop).trim()) || (c.bouwjaar && String(c.bouwjaar).trim()) || "";
  const titelVan = c => c.type || c.onderdeel || "Naamloos onderdeel";

  function startDatum(c){
    if(c.datum && dag(c.datum)) return String(c.datum).slice(0, 10);
    if(isPeriode(c.periode)) return c.periode + "-01";
    return null;
  }
  function ageInfo(c){
    const s = startDatum(c);
    if(!s) return null;
    return {dagen: dagenTussen(s, vandaag()), schatting: !c.datum};
  }
  const vereistAandacht = c => { if(!isOpen(c) || c.uitbesteed) return false; const a = ageInfo(c); return !!(a && a.dagen >= INST.dagen); };
  // Datum waarop de claim is afgehandeld, uit de tijdlijn. Oudere claims hebben die niet.
  function afgehandeldOp(c){
    if(isOpen(c)) return null;
    const n = (Array.isArray(c.notities) ? c.notities : []).filter(x => x && x.soort === "status" && (x.naar === "gehonoreerd" || x.naar === "afgewezen"));
    return n.length ? n.map(x => x.d).sort().pop() : null;
  }
  function doorlooptijd(c){
    const eind = afgehandeldOp(c), begin = startDatum(c);
    return eind && begin ? dagenTussen(begin, eind) : null;
  }

  /* ---------- leveranciers: vaste kleur en letters ---------- */
  const LEVKLEUREN = ["#2e4057","#1f9e96","#e8382b","#8a5a9e","#2f6f3e","#b4651a","#4a6b8a","#7a4a2b"];
  function levKleur(naam){
    const n = String(naam || "").trim();
    if(!n) return "#8a8f96";
    let h = 0;
    for(let i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0;
    return LEVKLEUREN[h % LEVKLEUREN.length];
  }
  function levLetters(naam){
    const n = String(naam || "").trim();
    if(!n) return "?";
    const d = n.split(/[\s-]+/).filter(Boolean);
    return (d.length > 1 ? d[0][0] + d[1][0] : n.slice(0, 2)).toUpperCase();
  }

  /* ---------- instellingen (staan als rij _instellingen in de tabel) ---------- */
  const INST_ID = "_instellingen";
  const INST_STANDAARD = {
    vestiging: "Vestiging Meppel",
    dagen: 42,
    leveranciers: ["Direct Healthcare","Eureva","Mercado","Sowecare","UnitedCare","Umotion","Wellco"],
    uitbesteedLev: ["Wellco"],
    levMail: {},
    autoInvoer: true,
    prijzen: [{woord:"speling", bedrag:780}, {woord:"beremd wiel", bedrag:114},
      {woord:"seatsupport", bedrag:507}, {woord:"seat support", bedrag:507}, {woord:"jukmotor", bedrag:351}]
  };
  let INST = {...INST_STANDAARD};
  function instUit(o){
    if(!o || typeof o !== "object") return {...INST_STANDAARD};
    return {
      vestiging: typeof o.vestiging === "string" && o.vestiging.trim() ? o.vestiging.trim() : INST_STANDAARD.vestiging,
      dagen: Number(o.dagen) > 0 ? Math.round(Number(o.dagen)) : INST_STANDAARD.dagen,
      leveranciers: Array.isArray(o.leveranciers) && o.leveranciers.length ? o.leveranciers : INST_STANDAARD.leveranciers,
      uitbesteedLev: Array.isArray(o.uitbesteedLev) ? o.uitbesteedLev : INST_STANDAARD.uitbesteedLev,
      levMail: o.levMail && typeof o.levMail === "object" ? o.levMail : {},
      autoInvoer: o.autoInvoer !== false,
      prijzen: Array.isArray(o.prijzen)
        ? o.prijzen.filter(r => r && typeof r.woord === "string" && r.woord.trim() && Number(r.bedrag) > 0)
                   .map(r => ({woord:r.woord.trim(), bedrag:Number(r.bedrag)}))
        : INST_STANDAARD.prijzen.slice()
    };
  }
  function instUitRij(rij){
    if(!rij) return {...INST_STANDAARD};
    try{ return instUit(JSON.parse(rij.bijzonderheden || "{}")); }catch(e){ return {...INST_STANDAARD}; }
  }
  function pasInstToe(){
    el("vestiging").textContent = INST.vestiging;
    document.title = "Garantieclaims Medipoint " + INST.vestiging.replace(/^vestiging\s+/i, "");
  }

  /* ======================================================================
     TOEGANG EN OPSLAG
     ====================================================================== */
  const SLEUTEL_PW = "garanties-meppel-toegang";
  /* Rollen: "beheer" mag alles, "kijken" alleen bekijken. */
  function rol(){
    if(CONFIG.ACCOUNTS) return sessie ? "beheer" : null;
    if(!CONFIG.WACHTWOORD_HASH && !CONFIG.BEHEER_HASH) return "beheer";
    const h = ls.get(SLEUTEL_PW);
    if(h && CONFIG.BEHEER_HASH && h === CONFIG.BEHEER_HASH) return "beheer";
    if(h && h === CONFIG.WACHTWOORD_HASH) return CONFIG.BEHEER_HASH ? "kijken" : "beheer";
    return null;
  }
  const magBewerken = () => rol() === "beheer";
  function alleenKijkenMelding(){ toast("Alleen een beheerder kan dit — log in als beheerder via het Menu"); }
  const SLEUTEL_SESSIE = "claimregister-sessie";
  const SLEUTEL_CACHE = "claimregister-cache-v2";
  const SLEUTEL_LOKAAL = "garanties-meppel-v1";
  const SLEUTEL_LOKAAL_INST = "garanties-meppel-inst";
  const SLEUTEL_WEERGAVE = "claimregister-weergave";
  const SLEUTEL_THEMA = "claimregister-thema-donker";

  let sessie = ls.json(SLEUTEL_SESSIE);
  function bewaarSessie(s){ sessie = s; if(s) ls.set(SLEUTEL_SESSIE, JSON.stringify(s)); else ls.del(SLEUTEL_SESSIE); }

  async function authAanvraag(grant, body){
    const r = await fetch(BASE + "/auth/v1/token?grant_type=" + grant, {
      method:"POST", headers:{apikey:KEY, "Content-Type":"application/json"}, body:JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(j.error_description || j.msg || j.message || "Inloggen mislukt");
    return {access_token:j.access_token, refresh_token:j.refresh_token,
      expires_at: Date.now() + (Number(j.expires_in) || 3600) * 1000,
      email: (j.user && j.user.email) || body.email || (sessie && sessie.email) || ""};
  }
  class AuthFout extends Error {}
  async function kop(extra){
    let token = KEY;
    if(CONFIG.ACCOUNTS){
      if(!sessie) throw new AuthFout("niet ingelogd");
      if(Date.now() > sessie.expires_at - 60000){
        try{ bewaarSessie(await authAanvraag("refresh_token", {refresh_token:sessie.refresh_token})); }
        catch(e){ throw new AuthFout("sessie verlopen"); }
      }
      token = sessie.access_token;
    }
    return {apikey:KEY, Authorization:"Bearer " + token, "Content-Type":"application/json", ...(extra || {})};
  }
  async function verzoek(url, opties){
    const r = await fetch(url, {...opties, headers: await kop(opties && opties.headers)});
    if(r.status === 401 && CONFIG.ACCOUNTS) throw new AuthFout("geen toegang");
    return r;
  }

  // Alle kolommen die de app schrijft. Kent de tabel er een niet, dan laat de app die weg.
  const KOLOMMEN = ["id","nummer","onderdeel","voorziening","type","frame","storing","inkoopnummer","leverancier","aankoop",
    "bouwjaar","bedrag","datum","periode","status","locatie","uitbesteed","bijzonderheden","notities","bijgewerkt","verwijderd"];
  const onbekendeKolommen = new Set(ls.json("claimregister-onbekend") || []);
  function naarRij(c){
    const r = {};
    KOLOMMEN.forEach(k => {
      if(onbekendeKolommen.has(k)) return;
      let v = c[k];
      if(k === "notities") v = Array.isArray(v) ? v : [];
      else if(k === "uitbesteed") v = !!v;
      else if(k === "bedrag") v = (v == null || v === "") ? null : Number(v);
      else if(v === undefined || v === "") v = (k === "verwijderd" || k === "datum") ? null : (v === "" ? "" : null);
      r[k] = v;
    });
    return r;
  }
  async function apiGet(){
    const r = await verzoek(API + "?select=*", {});
    if(!r.ok) throw new Error("GET " + r.status);
    return r.json();
  }
  async function apiSave(rijen){
    for(let poging = 0; poging < KOLOMMEN.length; poging++){
      const body = rijen.map(r => { const o = {...r}; onbekendeKolommen.forEach(k => delete o[k]); return o; });
      const r = await verzoek(API, {method:"POST", headers:{Prefer:"resolution=merge-duplicates,return=minimal"}, body:JSON.stringify(body)});
      if(r.ok) return;
      const t = await r.text().catch(() => "");
      const m = t.match(/'([a-z_]+)' column/i) || t.match(/column "?([a-z_]+)"? (?:of|does)/i);
      if(m && m[1] !== "id" && !onbekendeKolommen.has(m[1])){
        onbekendeKolommen.add(m[1]);
        ls.set("claimregister-onbekend", JSON.stringify([...onbekendeKolommen]));
        toast("De tabel kent de kolom ‘" + m[1] + "’ nog niet — zie supabase-beveiliging.sql");
        continue;
      }
      throw new Error("POST " + r.status + " " + t.slice(0, 160));
    }
  }
  async function apiDelete(id){
    const r = await verzoek(API + "?id=eq." + encodeURIComponent(id), {method:"DELETE"});
    if(!r.ok) throw new Error("DELETE " + r.status);
  }

  /* ---------- staat ---------- */
  const opgeslagenWeergave = ls.json(SLEUTEL_WEERGAVE) || {};
  const state = {
    claims: [], loaded:false, live:false, offline:false,
    period:"all", q:"", status: ["", "open", "aandacht", "afgehandeld"].includes(opgeslagenWeergave.status) ? opgeslagenWeergave.status : "open",
    uit: opgeslagenWeergave.uit || (opgeslagenWeergave.status === "uitbesteed" ? "ja" : ""),
    loc: opgeslagenWeergave.loc || "", lev: opgeslagenWeergave.lev || "",
    sort: opgeslagenWeergave.sort || "standaard", groep: opgeslagenWeergave.groep || "maand",
    view:"lijst", trash:false, selecteren:false, geselecteerd:new Set(),
    confirmId:null, expanded:new Set(), tabel:false
  };
  function bewaarWeergave(){
    ls.set(SLEUTEL_WEERGAVE, JSON.stringify({status:state.status, uit:state.uit, loc:state.loc, lev:state.lev, sort:state.sort, groep:state.groep}));
  }
  function schrijfCache(){
    if(REMOTE) ls.set(SLEUTEL_CACHE, JSON.stringify({tijd:Date.now(), claims:state.claims, inst:INST}));
    else { ls.set(SLEUTEL_LOKAAL, JSON.stringify(state.claims)); ls.set(SLEUTEL_LOKAAL_INST, JSON.stringify(INST)); }
  }
  function leesRijen(rows){
    const inst = rows.find(r => r.id === INST_ID);
    if(inst){ INST = instUitRij(inst); pasInstToe(); }
    return rows.filter(r => r && r.id && String(r.id).charAt(0) !== "_").map(r => ({
      ...r,
      bedrag: (r.bedrag == null || r.bedrag === "") ? null : Number(r.bedrag),
      notities: Array.isArray(r.notities) ? r.notities : (typeof r.notities === "string" ? (()=>{ try{ return JSON.parse(r.notities) || []; }catch(e){ return []; } })() : [])
    }));
  }

  let bezigMetLaden = false;
  async function refresh(){
    if(!REMOTE || bezigMetLaden) return;
    bezigMetLaden = true;
    try{
      const rows = await apiGet();
      // Een open dialoog of selectie niet onder iemands handen verversen.
      state.claims = leesRijen(rows);
      state.loaded = true; state.live = true; state.offline = false;
      schrijfCache();
      banner("");
      setTimeout(dagCheck, 0);
      if(!document.querySelector(".overlay")) render(); else renderSync();
    }catch(err){
      if(err instanceof AuthFout){ uitloggen("Je sessie is verlopen. Log opnieuw in."); return; }
      state.offline = true;
      banner(state.claims.length
        ? "Even geen verbinding met de database. Je ziet de laatst opgehaalde lijst" + (state.cacheTijd ? " van " + new Date(state.cacheTijd).toLocaleString("nl-NL", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) : "") + "; wijzigingen worden pas bewaard als de verbinding terug is."
        : "De claims konden niet worden opgehaald. Controleer je internetverbinding.");
      state.loaded = true;
      render();
    }finally{ bezigMetLaden = false; }
  }

  /* Bewaar een of meer claims. Optimistisch: eerst op het scherm, dan naar de database. */
  async function bewaar(claims, melding, ongedaan){
    if(!magBewerken()){ alleenKijkenMelding(); return false; }
    const nu = vandaag();
    claims = claims.map(c => ({...c, bijgewerkt: nu}));
    claims.forEach(c => {
      const i = state.claims.findIndex(x => x.id === c.id);
      if(i > -1) state.claims[i] = c; else state.claims.push(c);
    });
    render();
    schrijfCache();
    if(!REMOTE){ if(melding) toast(melding, ongedaan); return true; }
    try{
      await apiSave(claims.map(naarRij));
      if(melding) toast(melding, ongedaan);
      refresh();
      return true;
    }catch(err){
      if(err instanceof AuthFout){ uitloggen("Je sessie is verlopen. Log opnieuw in."); return false; }
      toast("Opslaan mislukt — controleer je verbinding");
      refresh();
      return false;
    }
  }
  const kopie = c => JSON.parse(JSON.stringify(c));
  function terugdraaier(voor, extraWeg){
    return async () => {
      if(extraWeg) await purge(extraWeg, true);
      if(voor.length) await bewaar(voor, "Teruggedraaid");
    };
  }
  /* Wie doet wat: naam per apparaat (of uit het account) bij elke regel in de tijdlijn */
  const SLEUTEL_NAAM = "claimregister-naam";
  function wie(){
    const n = (ls.get(SLEUTEL_NAAM) || "").trim();
    if(n) return n;
    if(CONFIG.ACCOUNTS && sessie && sessie.email) return sessie.email.split("@")[0];
    return "";
  }
  function regel(t, extra){
    const r = {d: vandaag(), t, ...(extra || {})};
    const w = wie();
    if(w) r.w = w;
    return r;
  }
  const metRegel = (c, t, extra) => ({...c, notities:[...(Array.isArray(c.notities) ? c.notities : []), regel(t, extra)]});
  function metStatus(c, naar, tekst){
    const van = statusVan(c);
    if(van === naar) return c;
    return {...metRegel(c, tekst || ("Status: " + STATUS[van].label + " → " + STATUS[naar].label), {soort:"status", naar}), status:naar};
  }
  const VELDNAAM = {onderdeel:"onderdeel", type:"type", voorziening:"voorzieningnummer", frame:"framenummer", inkoopnummer:"inkoopnummer",
    leverancier:"leverancier", aankoop:"aankoopdatum", bedrag:"bedrag", periode:"maand", locatie:"monteur", uitbesteed:"uitbesteed",
    storing:"storing", bijzonderheden:"bijzonderheden"};
  function wijzigingTekst(oud, nieuw){
    const norm = v => v == null ? "" : String(v).trim();
    const waarde = (c, k) => k === "aankoop" ? aankoopVan(c) : c[k];
    const delen = Object.keys(VELDNAAM).filter(k => norm(waarde(oud, k)) !== norm(waarde(nieuw, k))).map(k => {
      if(k === "inkoopnummer" && nieuw[k]) return "inkoopnummer " + nieuw[k];
      if(k === "bedrag" && nieuw[k] != null) return "bedrag " + euro(nieuw[k]);
      if(k === "leverancier" && nieuw[k]) return "leverancier " + nieuw[k];
      return VELDNAAM[k];
    });
    return delen.length ? "Bewerkt: " + delen.join(", ") : "";
  }
  async function zetStatus(ids, naar){
    const voor = ids.map(id => state.claims.find(c => c.id === id)).filter(Boolean).filter(c => statusVan(c) !== naar);
    if(!voor.length) return;
    const na = voor.map(c => metStatus(kopie(c), naar));
    await bewaar(na, (na.length === 1 ? "Claim" : na.length + " claims") + " op " + STATUS[naar].label.toLowerCase() + " gezet", terugdraaier(voor.map(kopie)));
  }
  async function naarPrullenbak(ids){
    const voor = ids.map(id => state.claims.find(c => c.id === id)).filter(Boolean);
    if(!voor.length) return;
    const na = voor.map(c => ({...metRegel(kopie(c), "Naar de prullenbak"), verwijderd: vandaag()}));
    state.confirmId = null;
    await bewaar(na, (na.length === 1 ? "Claim" : na.length + " claims") + " naar de prullenbak", terugdraaier(voor.map(kopie)));
  }
  async function terugzetten(id){
    const c = state.claims.find(x => x.id === id);
    if(!c) return;
    await bewaar([{...metRegel(kopie(c), "Teruggezet uit de prullenbak"), verwijderd:null}], "Claim teruggezet");
  }
  async function purge(id, stil){
    if(!magBewerken()){ alleenKijkenMelding(); return; }
    state.confirmId = null;
    state.claims = state.claims.filter(c => c.id !== id);
    render(); schrijfCache();
    if(!REMOTE){ if(!stil) toast("Definitief verwijderd"); return; }
    try{ await apiDelete(id); if(!stil) toast("Definitief verwijderd"); refresh(); }
    catch(err){ if(err instanceof AuthFout){ uitloggen("Je sessie is verlopen. Log opnieuw in."); return; } toast("Verwijderen mislukt"); refresh(); }
  }
  async function bewaarInst(nieuw){
    if(!magBewerken()){ alleenKijkenMelding(); return; }
    INST = instUit({...INST, ...nieuw});
    pasInstToe(); render(); schrijfCache();
    if(!REMOTE){ toast("Instellingen opgeslagen"); return; }
    try{
      await apiSave([{id:INST_ID, onderdeel:"", nummer:"", leverancier:"", status:"nieuw", locatie:"binnen", bedrag:0, periode:"",
        bijzonderheden: JSON.stringify(INST)}]);
      toast("Instellingen opgeslagen");
    }catch(e){ toast("Opslaan mislukt"); }
  }

  /* ======================================================================
     SELECTIE VAN DE LIJST
     ====================================================================== */
  const actief = () => state.claims.filter(c => !c.verwijderd);
  const prullenbak = () => state.claims.filter(c => c.verwijderd);
  const zoekTekst = c => [c.nummer, c.onderdeel, c.leverancier, c.inkoopnummer, c.bijzonderheden, c.voorziening, c.type, c.frame,
    c.storing, c.aankoop, (Array.isArray(c.notities) ? c.notities.map(n => n && n.t).join(" ") : "")].join(" ").toLowerCase();

  function baseRows(zonderPeriode){
    const q = state.q.trim().toLowerCase();
    const woorden = q.split(/\s+/).filter(Boolean);
    return actief().filter(c => {
      if(!zonderPeriode && state.period !== "all" && (c.periode || "") !== state.period) return false;
      if(state.loc && (c.locatie || "") !== state.loc) return false;
      if(state.lev && (c.leverancier || "") !== state.lev) return false;
      if(state.uit === "ja" && !c.uitbesteed) return false;
      if(state.uit === "nee" && c.uitbesteed) return false;
      if(woorden.length){ const h = zoekTekst(c); if(!woorden.every(w => h.includes(w))) return false; }
      return true;
    });
  }
  function filterTab(c){
    switch(state.status){
      case "open": return isOpen(c);
      case "aandacht": return vereistAandacht(c);
      case "afgehandeld": return !isOpen(c);
      case "uitbesteed": return !!c.uitbesteed;
      default: return true;
    }
  }
  const STATUSVOLGORDE = {nieuw:0, ingediend:1, gehonoreerd:2, afgewezen:3};
  function visible(){
    const lijst = baseRows().filter(filterTab).sort((a, b) => {
      if(state.sort === "inkoop") return String(a.inkoopnummer || "~").localeCompare(String(b.inkoopnummer || "~"), "nl", {numeric:true});
      if(state.sort === "status") return (STATUSVOLGORDE[statusVan(a)] - STATUSVOLGORDE[statusVan(b)]) || ((ageInfo(b) || {dagen:-1}).dagen - (ageInfo(a) || {dagen:-1}).dagen);
      if(state.sort === "periode") return String(b.periode || "").localeCompare(String(a.periode || ""));
      if(state.sort === "bedrag") return (Number(b.bedrag) || 0) - (Number(a.bedrag) || 0);
      if(state.sort === "ouderdom") return ((ageInfo(b) || {dagen:-1}).dagen) - ((ageInfo(a) || {dagen:-1}).dagen);
      if(state.sort === "bijgewerkt") return String(b.bijgewerkt || "").localeCompare(String(a.bijgewerkt || ""));
      if(state.sort === "leverancier") return String(a.leverancier || "").localeCompare(String(b.leverancier || ""), "nl")
        || titelVan(a).localeCompare(titelVan(b), "nl");
      if(state.sort === "onderdeel") return titelVan(a).localeCompare(titelVan(b), "nl");
      const oa = isOpen(a), ob = isOpen(b);
      if(oa !== ob) return oa ? -1 : 1;
      const pa = String(a.periode || ""), pb = String(b.periode || "");
      if(pa !== pb) return oa ? pa.localeCompare(pb) : pb.localeCompare(pa);
      return titelVan(a).localeCompare(titelVan(b), "nl");
    });
    return state.sortOm ? lijst.reverse() : lijst;
  }
  const alleLeveranciers = () => [...new Set([...INST.leveranciers, ...state.claims.map(c => c.leverancier).filter(Boolean)])]
    .sort((a, b) => a.localeCompare(b, "nl"));

  /* ======================================================================
     WEERGAVE
     ====================================================================== */
  function renderPeriods(){
    const set = new Set(actief().map(c => c.periode).filter(isPeriode));
    set.add(thisPeriod());
    const nav = el("periods");
    nav.innerHTML = "";
    const mk = (val, label) => {
      const b = document.createElement("button");
      b.className = "period"; b.textContent = label; b.type = "button";
      b.setAttribute("aria-current", state.period === val ? "true" : "false");
      b.onclick = () => { state.period = val; render(); nav.scrollLeft = b.offsetLeft - 60; };
      nav.appendChild(b);
    };
    mk("all", "Alle periodes");
    [...set].sort().reverse().forEach(p => mk(p, periodShort(p)));
  }

  const TABNAAM = {"":"Alle claims", open:"Openstaand", aandacht:"Vereist aandacht", afgehandeld:"Afgehandeld"};
  function renderTeller(){
    const base = baseRows();
    const som = l => l.reduce((t, c) => t + (Number(c.bedrag) || 0), 0);
    const open = base.filter(isOpen), laat = base.filter(vereistAandacht), klaar = base.filter(c => !isOpen(c));
    const vakken = [
      ["open", "Open", open.length, euroKort(som(open))],
      ["aandacht", "Aandacht", laat.length, laat.length ? "> " + INST.dagen + " dagen" : "alles op tijd"],
      ["afgehandeld", "Afgehandeld", klaar.length, euroKort(som(klaar))],
      ["", "Alles", base.length, euroKort(som(base))]
    ];
    el("teller").innerHTML = vakken.map(([v, label, n, sub]) =>
      `<button type="button" role="tab" data-tab="${v}" aria-selected="${state.status === v}"${v === "aandacht" && n ? ' class="heeft"' : ""}>
        <b>${n}</b><span class="tl-label">${label}</span><span class="tl-sub">${esc(sub)}</span></button>`).join("");
  }

  function voortgangHtml(base){
    if(!base.length) return "";
    const totaal = base.reduce((t, c) => t + (Number(c.bedrag) || 0), 0);
    const open = base.filter(isOpen).reduce((t, c) => t + (Number(c.bedrag) || 0), 0);
    const done = totaal - open;
    const pct = totaal ? Math.round(done / totaal * 100) : 100;
    const alle = actief();
    const som = alle.reduce((t, c) => t + (Number(c.bedrag) || 0), 0);
    const pp = [...new Set(alle.map(c => c.periode).filter(isPeriode))].sort();
    const reeks = pp.length ? (pp.length === 1 ? periodLabel(pp[0]) : periodLabel(pp[0]) + " t/m " + periodLabel(pp[pp.length - 1])) : "";
    return `<section class="progress" aria-label="Voortgang"><div class="ptop"><span class="ptitle">Afgehandeld in bedrag</span><span class="ppct">${pct}%</span></div>
      <div class="pbar" role="img" aria-label="${pct} procent van het geclaimde bedrag is afgehandeld">
        <i class="done" style="width:${pct}%"></i><i class="open" style="width:${100 - pct}%"></i>
      </div>
      <div class="plegend">
        <span><i style="background:var(--ok)"></i>Afgehandeld ${esc(euro(done))}</span>
        <span><i style="background:var(--bad)"></i>Openstaand ${esc(euro(open))}</span>
      </div>
      <div class="ptotal">
        <span class="pt-label">Totaal geclaimd, alle periodes</span>
        <span class="pt-bedrag">${esc(euro(som))}</span>
        <span class="pt-sub">${alle.length} claims${reeks ? " · " + esc(reeks) : ""}</span>
      </div></section>`;
  }

  function perLeverancier(rows){
    const m = new Map();
    rows.forEach(c => {
      const k = (c.leverancier || "").trim() || "Zonder leverancier";
      const e = m.get(k) || {naam:k, n:0, open:0, openN:0, totaal:0, geh:0, gehN:0, afg:0, afgN:0, doorloop:[], oudste:0};
      const b = Number(c.bedrag) || 0;
      e.n++; e.totaal += b;
      if(isOpen(c)){ e.open += b; e.openN++; const a = ageInfo(c); if(a && a.dagen > e.oudste) e.oudste = a.dagen; }
      if(statusVan(c) === "gehonoreerd"){ e.geh += b; e.gehN++; }
      if(statusVan(c) === "afgewezen"){ e.afg += b; e.afgN++; }
      const d = doorlooptijd(c); if(d != null && !c.uitbesteed) e.doorloop.push(d);
      m.set(k, e);
    });
    return [...m.values()].sort((a, b) => b.open - a.open || b.totaal - a.totaal);
  }
  function ringSvg(pct, kleur, tekst){
    const p = Math.max(0, Math.min(100, Math.round(pct)));
    return `<svg class="ring" viewBox="0 0 42 42" role="img" aria-label="${esc(tekst)}">
      <circle class="ring-bg" cx="21" cy="21" r="15.9155" pathLength="100"></circle>
      <circle class="ring-v" cx="21" cy="21" r="15.9155" pathLength="100" stroke="${kleur}" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="25"></circle>
      <text class="ring-t" x="21" y="21" fill="${kleur}">${esc(tekst)}</text></svg>`;
  }

  function tijdlijnHtml(c){
    const n = (Array.isArray(c.notities) ? c.notities : []).filter(x => x && (x.t || x.d));
    if(!n.length) return "";
    return `<div class="tijdlijn">${n.slice().sort((x, y) => String(y.d || "").localeCompare(String(x.d || ""))).map(x =>
      `<div class="tl${x.soort === "status" ? " s s-" + esc(x.naar || "") : ""}"><span class="nd">${esc(fmtDate(x.d) || x.d || "")}</span><span class="bol"></span><span class="nt">${esc(x.t || "")}${x.w ? `<span class="tl-wie"> · ${esc(x.w)}</span>` : ""}</span></div>`).join("")}</div>`;
  }

  function statusPil(c){

  }
  function icoon(c, extra){
    return `<span class="blok-icoon${extra || ""}" style="--lev:${levKleur(c.leverancier)}" aria-hidden="true">${esc(levLetters(c.leverancier))}</span>`;
  }
  function blokHtml(c){
    const a = ageInfo(c);

    const bedrag = geenBedrag(c) ? "bedrag volgt" : euro(c.bedrag);

    const tweede = (c.inkoopnummer ? esc(c.inkoopnummer) : (isOpen(c) ? `<span class="wacht">wacht op nr</span>` : "")) + (state.groep === "maand" ? "" : (c.inkoopnummer || isOpen(c) ? " · " : "") + esc(periodShort(c.periode)));

      ? (st === "nieuw" ? `<button type="button" class="va va-info" data-act="ingediend" data-id="${id}">Ingediend</button>` : "") +
        `<button type="button" class="va va-ok" data-act="gehonoreerd" data-id="${id}">Gehonoreerd</button>
         <button type="button" class="va va-bad" data-act="afgewezen" data-id="${id}">Afwijzen</button>`

    return `<div class="blok-wrap">${acties ? `<div class="blok-acties" aria-label="Snelle acties">${acties}</div>` : ""}<button type="button" class="blok${laat ? " k-laat" : ""}${sel ? " k-sel" : ""}" data-card="${esc(c.id)}"${state.selecteren ? ` aria-pressed="${sel}"` : ""}>
      ${state.selecteren && sel ? `<span class="blok-icoon vink" aria-hidden="true">✓</span>` : icoon(c)}
      <span class="blok-tekst"><b>${esc(titelVan(c))}</b><span>${esc(c.leverancier || "Zonder leverancier")}${tweede ? " · " + tweede : ""}</span></span>
      <span class="blok-rechts">${statusPil(c)}<span class="blok-sub">${esc(bedrag)}${dagen ? " · " + dagen : ""}</span></span>
      <span class="chev" aria-hidden="true">›</span>
    </button></div>`;
  }

  /* ---------- computer: claims als tabel ---------- */
  const brede = window.matchMedia("(min-width: 1100px)");
  const isBreed = () => brede.matches;
  brede.addEventListener("change", () => render());
  const KOLOMMEN_T = [["onderdeel","Type / onderdeel"],["leverancier","Leverancier"],["inkoop","Inkoopnummer"],["periode","Periode"],["bedrag","Bedrag","num"],["status","Status"],["ouderdom","Dagen open","num"]];
  function tabelRij(c){
    const a = ageInfo(c), laat = vereistAandacht(c), sel = state.geselecteerd.has(c.id);

    return `<tr data-card="${esc(c.id)}" class="${laat ? "k-laat" : ""}${sel ? " k-sel" : ""}" tabindex="0">

      <td class="t-titel">${icoon(c)}<span><b>${esc(titelVan(c))}</b>${c.storing ? `<span class="klein">${esc(c.storing)}</span>` : ""}</span></td>
      <td>${esc(c.leverancier || "—")}${c.uitbesteed ? `<span class="klein">uitbesteed</span>` : ""}</td>
      <td class="mono">${c.inkoopnummer ? esc(c.inkoopnummer) : `<span class="wacht">wacht op nummer</span>`}</td>

      <td>${statusPil(c)}</td>
      <td class="num">${dagen}</td>
      <td class="t-acties">${(state.selecteren || !magBewerken()) ? "" : (isOpen(c)
        ? (statusVan(c) === "nieuw" ? `<button type="button" class="ta ta-info" data-act="ingediend" data-id="${esc(c.id)}" title="Ingediend">Ingediend</button>` : "") +
          `<button type="button" class="ta ta-ok" data-act="gehonoreerd" data-id="${esc(c.id)}" title="Gehonoreerd">✓</button><button type="button" class="ta ta-bad" data-act="afgewezen" data-id="${esc(c.id)}" title="Afwijzen">✕</button>`
        : `<button type="button" class="ta" data-act="heropenen" data-id="${esc(c.id)}" title="Heropenen">↺</button>`)}<span class="t-pijl" aria-hidden="true">›</span></td>
    </tr>`;
  }
  function sorteerChips(){
    return `<div class="sorteer-rij" role="group" aria-label="Sorteren"><span>Sorteer</span>${KOLOMMEN_T.map(([k, label]) => {
      const actief = state.sort === k;
      return `<button type="button" class="sorteer-chip${actief ? " actief" : ""}" data-sorteer="${k}">${label.replace(" / onderdeel", "")}${actief ? (state.sortOm ? " ▲" : " ▼") : ""}</button>`;
    }).join("")}</div>`;
  }
  function tabelHtml(groepen){
    const kop = `<tr>${state.selecteren ? `<th class="t-vink"></th>` : ""}${KOLOMMEN_T.map(([k, label, cls]) => {
      const actief = state.sort === k;
      return `<th class="${cls || ""}${actief ? " actief" : ""}" data-sorteer="${k}" aria-sort="${actief ? (state.sortOm ? "ascending" : "descending") : "none"}">${label}<i>${actief ? (state.sortOm ? "▲" : "▼") : "↕"}</i></th>`;
    }).join("")}<th></th></tr>`;
    const kol = KOLOMMEN_T.length + 2 + (state.selecteren ? 1 : 0);
    const body = groepen.map(([titel, lijst]) => {
      const som = lijst.reduce((t, c) => t + (Number(c.bedrag) || 0), 0);
      const nOpen = lijst.filter(isOpen).length;
      return (titel ? `<tr class="t-groep"><td colspan="${kol}"><span>${esc(titel)} · ${lijst.length}</span><span>${nOpen ? `<b class="mo">${nOpen} open</b> · ` : ""}${esc(euro(som))}</span></td></tr>` : "") + lijst.map(tabelRij).join("");
    }).join("");
    const alle = groepen.flatMap(g => g[1]);
    const totaal = alle.reduce((t, c) => t + (Number(c.bedrag) || 0), 0);
    const voet = `<tr>${state.selecteren ? "<td></td>" : ""}<td colspan="4"><b>Totaal</b> · ${meervoud(alle.length, "claim", "claims")}</td><td class="num mono"><b>${esc(euro(totaal))}</b></td><td colspan="3"></td></tr>`;
    return `<div class="tabelkader"><table class="claimtabel"><thead>${kop}</thead><tbody>${body}</tbody><tfoot>${voet}</tfoot></table></div>`;
  }

  function groepBlok(lijst, titel){
    const som = lijst.reduce((t, c) => t + (Number(c.bedrag) || 0), 0);
    const nOpen = lijst.filter(isOpen).length;
    const nLaat = lijst.filter(vereistAandacht).length;
    return `<section class="groep">
      <div class="groepkop${nOpen ? " heeft-open" : ""}${nLaat ? " heeft-laat" : ""}">
        <span class="gk-titel"><i></i>${esc(titel)} · ${lijst.length}</span>
        <span class="gk-cijfers">${nOpen ? `<span class="mo">${nOpen} open</span> · ` : ""}${esc(euro(som))}</span>
      </div>
      ${lijst.map(blokHtml).join("")}
    </section>`;
  }

  let detailVenster = null;
  function detailHtml(c){
    const st = statusVan(c);
    const open = isOpen(c);
    const a = ageInfo(c);
    const lang = vereistAandacht(c);
    let pct, kleur, ringtekst;
    if(c.uitbesteed){ pct = 100; kleur = "var(--geel-rand)"; ringtekst = "80"; }
    else if(st === "afgewezen"){ pct = 100; kleur = "var(--bad)"; ringtekst = "✕"; }
    else if(!open){ pct = 100; kleur = "var(--ok)"; ringtekst = "✓"; }
    else if(a){ pct = a.dagen / INST.dagen * 100; kleur = lang ? "var(--rood)" : "var(--geel-rand)"; ringtekst = a.dagen + "d"; }
    else { pct = 0; kleur = "var(--line)"; ringtekst = "—"; }
    const d = doorlooptijd(c);
    const id = esc(c.id);
    return `<div class="detail-kop">${icoon(c)}<div><h2>${esc(titelVan(c))}</h2>
        <span class="dk-sub">${esc(c.leverancier || "Zonder leverancier")} · ${esc(periodLabel(c.periode))}</span></div></div>
      <div class="detail-bedrag">
        <div class="db-pillen">
          <span class="db-bedrag${geenBedrag(c) ? " wait" : ""}">${geenBedrag(c) ? "Bedrag volgt later" : esc(euro(c.bedrag))}</span>
          <span>${statusPil(c)}${lang ? ` <span class="aandacht">Vereist aandacht</span>` : ""}</span>
        </div>
        <div class="kaart-ring">${ringSvg(pct, kleur, ringtekst)}</div>
      </div>
      ${c.storing ? `<p class="storing">${esc(c.storing)}</p>` : ""}
      <div class="meta">
        <span>Inkoopnummer<b${c.inkoopnummer ? "" : ' class="wait"'}>${c.inkoopnummer ? esc(c.inkoopnummer) : "wacht op nummer"}</b></span>
        ${(c.onderdeel && c.onderdeel !== c.type) ? `<span>Onderdeel<b>${esc(c.onderdeel)}</b></span>` : ""}
        ${c.voorziening ? `<span>Voorzieningnummer<b>${esc(c.voorziening)}</b></span>` : ""}
        ${c.frame ? `<span>Framenummer<b>${esc(c.frame)}</b></span>` : ""}
        <span>Aankoopdatum<b${aankoopVan(c) ? "" : ' class="wait"'}>${esc(aankoopVan(c) || "onbekend")}</b></span>
        <span>Monteur<b>${c.locatie === "buiten" ? "Buitenmonteur" : "Binnenmonteur"}</b></span>
        ${c.datum ? `<span>Ingediend<b>${esc(fmtDate(c.datum))}</b></span>` : ""}
        ${afgehandeldOp(c) ? `<span>Afgehandeld<b>${esc(fmtDate(afgehandeldOp(c)))}</b></span>` : ""}
        ${c.nummer ? `<span>Claimnummer<b>${esc(c.nummer)}</b></span>` : ""}
        ${(() => { const l = (c.notities || []).filter(x => x && x.w).slice(-1)[0]; return l ? `<span>Laatst door<b>${esc(l.w)}, ${esc(fmtDate(l.d))}</b></span>` : ""; })()}
      </div>
      ${d != null ? `<span class="doorloop">Afgehandeld na <b>${meervoud(d, "dag", "dagen")}</b></span>` :
        (open && a ? `<span class="doorloop">Staat <b>${meervoud(a.dagen, "dag", "dagen")}</b> open${a.schatting ? " (geschat vanaf de periode)" : ""} · termijn ${INST.dagen} dagen</span>` : "")}
      ${c.bijzonderheden ? `<p class="note">${esc(c.bijzonderheden)}</p>` : ""}
      ${tijdlijnHtml(c)}
      ${!magBewerken() ? `<div class="row-actions">
        ${open && !c.uitbesteed ? `<button class="icon-btn" data-act="agenda" data-id="${id}">Herinnering</button>` : ""}
        <span class="alleen-kijken-tekst">Alleen kijken — log in als beheerder om deze claim te wijzigen.</span></div>` : `<div class="row-actions">
        ${st === "nieuw" ? `<button class="icon-btn" data-act="ingediend" data-id="${id}">Ingediend</button>` : ""}
        ${open
          ? `<button class="icon-btn ok" data-act="gehonoreerd" data-id="${id}">Gehonoreerd</button>
             <button class="icon-btn warn" data-act="afgewezen" data-id="${id}">Afwijzen</button>`
          : `<button class="icon-btn" data-act="heropenen" data-id="${id}">Heropenen</button>`}
        <span class="tussen" aria-hidden="true"></span>
        <button class="icon-btn" data-act="notitie" data-id="${id}">Notitie</button>
        <button class="icon-btn" data-act="bewerken" data-id="${id}">Bewerken</button>
        <button class="icon-btn" data-act="dupliceren" data-id="${id}">Dupliceren</button>
        ${open && !c.uitbesteed ? `<button class="icon-btn" data-act="agenda" data-id="${id}">Herinnering</button>` : ""}
        <button class="icon-btn danger rechts" data-act="verwijderen" data-id="${id}">Verwijderen</button>
      </div>`}
      ${state.confirmId === c.id ? `<div class="confirm">${esc(titelVan(c))} naar de prullenbak?
        <button class="btn" data-act="annuleren">Annuleren</button>
        <button class="btn btn-primary" data-act="bevestig" data-id="${id}">Verwijderen</button></div>` : ""}
      <div class="sheet-actions"><button type="button" class="btn btn-ghost" data-sluit="1">Sluiten</button></div>`;
  }
  function markeerOpen(id){
    document.querySelectorAll(".claimtabel tr.k-open-detail").forEach(t => t.classList.remove("k-open-detail"));
    if(id){ const tr = document.querySelector(`.claimtabel tr[data-card="${CSS.escape(id)}"]`); if(tr) tr.classList.add("k-open-detail"); }
  }
  function openDetail(id){
    const c = state.claims.find(x => x.id === id);
    if(!c) return;
    state.confirmId = null;
    document.querySelectorAll(".overlay.zijpaneel").forEach(o => o.remove());
    const v = openSheet(`<div class="sheet detail" data-detail="${esc(id)}">${detailHtml(c)}</div>`,
      {paneel:true, focus:"button[data-act]", naSluiten: () => { detailVenster = null; state.confirmId = null; markeerOpen(); }});
    markeerOpen(id);
    detailVenster = {id, ...v};
    v.ov.addEventListener("click", async e => {
      const t = e.target.closest("button[data-act]");
      if(!t) return;
      const act = t.dataset.act;
      if(act === "verwijderen"){ state.confirmId = id; ververs(); return; }
      if(act === "annuleren"){ state.confirmId = null; ververs(); return; }
      v.sluit();
      await voerUit(act, t.dataset.id);
    });
    function ververs(){
      const nu = state.claims.find(x => x.id === id);
      if(!nu){ v.sluit(); return; }
      v.ov.querySelector(".sheet").innerHTML = detailHtml(nu);
      v.ov.querySelectorAll("[data-sluit]").forEach(b => b.onclick = v.sluit);
    }
    detailVenster.ververs = ververs;
  }

  function trashCard(c){
    return `<article class="claim is-trash">
      <div class="claim-head"><h3 class="part">${esc(titelVan(c))}</h3><span class="amount">${esc(euro(c.bedrag))}</span></div>
      <div class="claim-sum"><span class="pill p-neutral">Verwijderd ${esc(fmtDate(c.verwijderd) || c.verwijderd || "")}</span>
        <span class="lev">${esc(c.leverancier || "Zonder leverancier")}</span>${c.inkoopnummer ? `<span>· ${esc(c.inkoopnummer)}</span>` : ""}</div>
      <div class="pills"><span class="row-actions">
        <button class="icon-btn" data-act="terugzetten" data-id="${esc(c.id)}">Terugzetten</button>
        <button class="icon-btn danger" data-act="purge" data-id="${esc(c.id)}">Definitief verwijderen</button>
      </span></div>
      ${state.confirmId === c.id ? `<div class="confirm">Deze claim is daarna echt weg.
        <button class="btn" data-act="annuleren">Annuleren</button>
        <button class="btn btn-primary" data-act="purgeok" data-id="${esc(c.id)}">Definitief verwijderen</button></div>` : ""}
    </article>`;
  }

  function renderSync(){
    const s = el("sync");
    if(!REMOTE){ s.className = "sync lokaal"; s.innerHTML = "<i></i><span class=\"sync-tekst\">Alleen op dit apparaat</span>"; return; }
    if(state.offline){ s.className = "sync offline"; s.innerHTML = "<i></i>Offline"; return; }
    if(!state.live){ s.className = "sync offline"; s.innerHTML = "<i></i>Laden…"; return; }
    s.className = "sync";
    s.innerHTML = "<i></i><span class=\"sync-tekst\">Bijgewerkt </span>" + new Date().toLocaleTimeString("nl-NL", {hour:"2-digit", minute:"2-digit"}) +
      (CONFIG.ACCOUNTS && sessie && sessie.email ? "<span class=\"sync-tekst\"> · " + esc(sessie.email) + "</span>" : "");
  }

  function syncFilterVelden(){
    el("q").value = state.q;
    el("fLoc").value = state.loc;
    el("fUit").value = state.uit;
    el("fSort").value = state.sort;
    el("fGroep").value = state.groep;
    const levs = alleLeveranciers();
    el("fLev").innerHTML = `<option value="">Alle leveranciers</option>` + levs.map(l => `<option value="${esc(l)}">${esc(l)}</option>`).join("");
    el("fLev").value = levs.includes(state.lev) ? state.lev : "";
  }

  function render(){
    openVeeg = null;
    renderRol();
    pasInstToe();
    renderSync();
    document.querySelectorAll(".tabbar [data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
    renderPeriods();
    el("printkop").textContent = "Afgedrukt op " + fmtDate(vandaag()) + " · " + (state.period === "all" ? "alle periodes" : periodLabel(state.period));

    if(state.view === "rapport"){
      el("lijstweergave").hidden = true;
      el("rapportweergave").hidden = false;
      renderBulk();
      renderRapport();
      return;
    }
    el("lijstweergave").hidden = false;
    el("rapportweergave").hidden = true;

    const bak = prullenbak();
    if(state.trash && !bak.length) state.trash = false;
    const inBak = state.trash;
    ["teller", "lijstkop"].forEach(id => { el(id).hidden = inBak; });
    if(inBak) el("filters").hidden = true;
    const tb = el("trashBtn");
    tb.hidden = !(bak.length || inBak);
    tb.textContent = inBak ? "Terug naar de claims" : `Prullenbak (${bak.length})`;

    const list = el("list");
    if(inBak){
      list.innerHTML = `<div class="groepkop"><span class="gk-titel"><i></i>Prullenbak · ${bak.length}</span></div>` +
        bak.slice().sort((a, b) => String(b.verwijderd || "").localeCompare(String(a.verwijderd || ""))).map(trashCard).join("");
      renderBulk();
      return;
    }

    const filtersAan = !!(state.q.trim() || state.loc || state.lev || state.uit || state.sort !== "standaard" || state.groep !== "maand");
    const extraAan = !!(state.loc || state.lev || state.uit || state.sort !== "standaard" || state.groep !== "maand");
    el("filterBtn").innerHTML = "Filters" + (extraAan ? `<span class="fdot"></span>` : "");
    el("selectBtn").setAttribute("aria-pressed", String(state.selecteren));
    el("selectBtn").textContent = state.selecteren ? "Klaar" : "Selecteren";
    renderTeller();
    el("dagmelding").innerHTML = dagmeldingHtml();
    const rows = visible();
    const somRows = rows.reduce((t, c) => t + (Number(c.bedrag) || 0), 0);
    el("lijstTitel").innerHTML = `<i style="background:${state.status === "aandacht" ? "var(--rood)" : state.status === "afgehandeld" ? "var(--ok)" : "var(--info)"}"></i>${esc(TABNAAM[state.status] || "Claims")}
      <span class="lk-bedrag">${rows.length} · ${esc(euro(somRows))}${filtersAan ? " · gefilterd" : ""}</span>`;

    if(!rows.length){
      list.innerHTML = `<div class="empty"><strong>${state.loaded ? "Geen claims in deze selectie" : "Claims laden…"}</strong>
        ${state.loaded ? (filtersAan || state.period !== "all" || state.status
          ? `Pas de periode, de teller bovenaan of de filters aan. <button type="button" class="linkbtn" data-act="allesTonen">Alles tonen</button>`
          : "Leg een nieuwe garantieclaim vast met <b>Claim toevoegen</b>, of sleep een LGAR-pdf op de pagina.")
          : "Even geduld, de opgeslagen claims worden opgehaald."}</div>`;
    } else if(isBreed()){
      let groepen;
      if(state.groep === "geen" || ["onderdeel","leverancier","inkoop","bedrag","status","ouderdom"].includes(state.sort)) groepen = [["", rows]];
      else {
        const perLev = state.groep === "leverancier", m = new Map();
        rows.forEach(c => { const k = perLev ? ((c.leverancier || "").trim() || "Zonder leverancier") : (c.periode || ""); if(!m.has(k)) m.set(k, []); m.get(k).push(c); });
        let keys = [...m.keys()];
        if(perLev) keys.sort((a, b) => m.get(b).length - m.get(a).length || a.localeCompare(b, "nl")); else keys.sort().reverse();
        groepen = keys.map(k => [perLev ? k : periodLabel(k), m.get(k)]);
      }
      list.innerHTML = tabelHtml(groepen);
    } else if(state.groep === "geen" || ["onderdeel","leverancier","inkoop","bedrag","status","ouderdom"].includes(state.sort)){
      list.innerHTML = sorteerChips() + groepBlok(rows, TABNAAM[state.status] || "Claims");
    } else {
      const perLev = state.groep === "leverancier";
      const groepen = new Map();
      rows.forEach(c => {
        const k = perLev ? ((c.leverancier || "").trim() || "Zonder leverancier") : (c.periode || "");
        if(!groepen.has(k)) groepen.set(k, []);
        groepen.get(k).push(c);
      });
      let sleutels = [...groepen.keys()];
      if(perLev) sleutels.sort((a, b) => groepen.get(b).length - groepen.get(a).length || a.localeCompare(b, "nl"));
      else sleutels.sort().reverse();
      list.innerHTML = sorteerChips() + sleutels.map(k => groepBlok(groepen.get(k), perLev ? k : periodLabel(k))).join("");
    }
    renderBulk();
    if(detailVenster && detailVenster.ververs) detailVenster.ververs();
  }

  /* ---------- selecteren en bulkacties ---------- */
  function renderBulk(){
    const balk = el("bulkbalk");
    const tonen = state.selecteren && state.view === "lijst" && !state.trash;
    balk.hidden = !tonen;
    document.body.classList.toggle("met-bulk", tonen);
    if(!tonen) return;
    const zichtbaar = new Set(visible().map(c => c.id));
    [...state.geselecteerd].forEach(id => { if(!zichtbaar.has(id)) state.geselecteerd.delete(id); });
    const sel = state.claims.filter(c => state.geselecteerd.has(c.id));
    const som = sel.reduce((t, c) => t + (Number(c.bedrag) || 0), 0);
    const leeg = !sel.length ? " disabled" : "";
    balk.innerHTML = `<span class="bb-tekst">${meervoud(sel.length, "claim", "claims")} geselecteerd<span>${esc(euro(som))} ·
        <button type="button" class="linkbtn" data-bulk="alles">${sel.length === zichtbaar.size && sel.length ? "Niets" : "Alles"} selecteren</button></span></span>
      <button type="button" class="icon-btn"${leeg} data-bulk="ingediend">Ingediend</button>
      <button type="button" class="icon-btn ok"${leeg} data-bulk="gehonoreerd">Gehonoreerd</button>
      <button type="button" class="icon-btn warn"${leeg} data-bulk="afgewezen">Afwijzen</button>
      <button type="button" class="icon-btn danger"${leeg} data-bulk="prullenbak">Prullenbak</button>
      <button type="button" class="icon-btn" data-bulk="klaar">Klaar</button>`;
  }
  el("bulkbalk").addEventListener("click", async e => {
    const b = e.target.closest("button[data-bulk]");
    if(!b || b.disabled) return;
    const ids = [...state.geselecteerd];
    const actie = b.dataset.bulk;
    if(actie === "alles"){
      const zicht = visible().map(c => c.id);
      if(state.geselecteerd.size === zicht.length) state.geselecteerd.clear(); else zicht.forEach(id => state.geselecteerd.add(id));
      render(); return;
    }
    if(actie === "klaar"){ stopSelecteren(); return; }
    state.geselecteerd.clear();
    if(actie === "prullenbak") await naarPrullenbak(ids);
    else await zetStatus(ids, actie);
  });
  function stopSelecteren(){ state.selecteren = false; state.geselecteerd.clear(); render(); }

  /* ======================================================================
     RAPPORTAGE
     ====================================================================== */
  const KLEUR = {geh:"var(--ok)", open:"var(--bad)", afg:"var(--grijs)"};
  function renderRapport(){
    const box = el("rapportweergave");
    const rows = baseRows();
    if(!actief().length){ box.innerHTML = `<div class="empty"><strong>Nog geen claims</strong>Zodra er claims zijn, zie je hier de cijfers.</div>`; return; }

    // kerncijfers
    const afgehandeld = rows.filter(c => !isOpen(c) && !c.uitbesteed);
    const nGeh = afgehandeld.filter(c => statusVan(c) === "gehonoreerd").length;
    const nAfg = afgehandeld.filter(c => statusVan(c) === "afgewezen").length;
    const graad = nGeh + nAfg ? Math.round(nGeh / (nGeh + nAfg) * 100) : null;
    const doorloop = rows.map(c => c.uitbesteed ? null : doorlooptijd(c)).filter(d => d != null);
    const gemDoor = doorloop.length ? Math.round(doorloop.reduce((a, b) => a + b, 0) / doorloop.length) : null;
    const metBedrag = rows.filter(c => !geenBedrag(c));
    const gemBedrag = metBedrag.length ? metBedrag.reduce((t, c) => t + Number(c.bedrag), 0) / metBedrag.length : 0;
    const zonderBedrag = rows.filter(c => geenBedrag(c)).length;
    const zonderInkoop = rows.filter(c => isOpen(c) && !c.inkoopnummer).length;

    // per maand (los van de gekozen periode, zodat je het verloop ziet)
    const perMaand = new Map();
    baseRows(true).forEach(c => {
      if(!isPeriode(c.periode)) return;
      const e = perMaand.get(c.periode) || {p:c.periode, geh:0, open:0, afg:0, n:0};
      const b = Number(c.bedrag) || 0;
      if(isOpen(c)) e.open += b; else if(statusVan(c) === "afgewezen") e.afg += b; else e.geh += b;
      e.n++;
      perMaand.set(c.periode, e);
    });
    const maanden = [...perMaand.values()].sort((a, b) => a.p.localeCompare(b.p)).slice(-12);

    // onderdelen die vaak terugkomen
    const perOnderdeel = new Map();
    rows.forEach(c => {
      const naam = titelVan(c);
      const k = naam.toLowerCase().replace(/\s+/g, " ").trim();
      const e = perOnderdeel.get(k) || {naam, n:0, totaal:0, lev:new Set(), open:0};
      e.n++; e.totaal += Number(c.bedrag) || 0; if(c.leverancier) e.lev.add(c.leverancier); if(isOpen(c)) e.open++;
      perOnderdeel.set(k, e);
    });
    const topOnderdelen = [...perOnderdeel.values()].filter(e => e.n > 1).sort((a, b) => b.n - a.n || b.totaal - a.totaal).slice(0, 10);

    // monteurs
    const monteur = ["binnen", "buiten"].map(l => {
      const r = rows.filter(c => (c.locatie === "buiten" ? "buiten" : "binnen") === l);
      return {l, n:r.length, totaal:r.reduce((t, c) => t + (Number(c.bedrag) || 0), 0), open:r.filter(isOpen).length};
    });
    const levs = perLeverancier(rows);
    const scope = state.period === "all" ? "alle periodes" : periodLabel(state.period);

    box.innerHTML = `
      ${voortgangHtml(rows)}
      <dl class="stats" style="padding-top:0">
        <div class="stat vlak-groen"><dt>Honoreringsgraad</dt><dd>${graad == null ? "—" : graad + "%"}</dd><span class="sub">${nGeh} gehonoreerd · ${nAfg} afgewezen</span></div>
        <div class="stat vlak-blauw"><dt>Gem. doorlooptijd</dt><dd>${gemDoor == null ? "—" : meervoud(gemDoor, "dag", "dagen")}</dd><span class="sub">${doorloop.length ? "gemeten bij " + meervoud(doorloop.length, "claim", "claims") : "nog niet gemeten"}</span></div>
        <div class="stat vlak-zwart"><dt>Gem. claimbedrag</dt><dd>${esc(euro(gemBedrag))}</dd><span class="sub">${zonderBedrag ? zonderBedrag + " zonder bedrag" : "alle claims met bedrag"}</span></div>
        <div class="stat vlak-geel"><dt>Wacht op inkoopnummer</dt><dd>${zonderInkoop}</dd><span class="sub">openstaande claims</span></div>
      </dl>

      <section class="paneel">
        <div class="paneel-kop"><h2>Geclaimd per maand</h2>
          <button type="button" class="schakel" data-act="tabelwissel">${state.tabel ? "Toon als grafiek" : "Toon als tabel"}</button></div>
        ${maanden.length ? (state.tabel ? maandTabel(maanden) : maandGrafiek(maanden)) : `<p class="uitleg-kort">Geen claims met een periode in deze selectie.</p>`}
        ${maanden.length && !state.tabel ? `<div class="legenda">
          <span><i style="background:${KLEUR.geh}"></i>Gehonoreerd</span>
          <span><i style="background:${KLEUR.open}"></i>Openstaand</span>
          <span><i style="background:${KLEUR.afg}"></i>Afgewezen</span></div>` : ""}
      </section>

      <section class="paneel">

  function niceMax(v){
    if(v <= 0) return 1000;
    const e = Math.pow(10, Math.floor(Math.log10(v)));
    const f = v / e;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
  }
  let grafiekData = [];
  function maandGrafiek(maanden){
    grafiekData = maanden;
    const W = 720, H = 250, L = 52, R = 8, T = 18, B = 26;
    const max = niceMax(Math.max(...maanden.map(m => m.geh + m.open + m.afg)));
    const ph = H - T - B, pw = W - L - R;
    const stap = pw / maanden.length;
    const bw = Math.min(46, stap * 0.62);
    const y = v => T + ph - v / max * ph;
    const gap = 2;
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Geclaimd bedrag per maand, verdeeld naar status">`;
    for(let i = 0; i <= 4; i++){
      const v = max / 4 * i, yy = y(v);
      svg += `<line class="${i ? "rooster" : "as"}" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"></line>`;
      svg += `<text class="aslabel" x="${L - 8}" y="${yy}" text-anchor="end" dominant-baseline="central">${esc(euroKort(v))}</text>`;
    }
    maanden.forEach((m, i) => {
      const x = L + stap * i + (stap - bw) / 2;
      let basis = 0;
      const delen = [["geh", m.geh], ["afg", m.afg], ["open", m.open]].filter(d => d[1] > 0);
      svg += `<g class="kolom" data-i="${i}">`;
      delen.forEach(([k, v], j) => {
        const top = y(basis + v), bodem = y(basis);
        const isBoven = j === delen.length - 1;
        const h = Math.max(0, bodem - top - (j ? gap : 0));
        const yTop = top;
        if(isBoven){
          const r = Math.min(4, h / 2, bw / 2);
          svg += `<path fill="${KLEUR[k]}" d="M${x},${yTop + h} V${yTop + r} Q${x},${yTop} ${x + r},${yTop} H${x + bw - r} Q${x + bw},${yTop} ${x + bw},${yTop + r} V${yTop + h} Z"></path>`;
        } else {
          svg += `<rect fill="${KLEUR[k]}" x="${x}" y="${yTop}" width="${bw}" height="${h}"></rect>`;
        }
        basis += v;
      });
      const tot = m.geh + m.open + m.afg;
      if(maanden.length <= 8 || i === maanden.length - 1)
        svg += `<text class="waarde" x="${x + bw / 2}" y="${y(tot) - 6}" text-anchor="middle">${esc(euroKort(tot).replace("€ ", "€"))}</text>`;
      svg += `<text class="aslabel" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(periodShort(m.p))}</text>`;
      svg += `<rect class="hit" x="${L + stap * i}" y="${T}" width="${stap}" height="${ph}"></rect></g>`;
    });
    svg += `</svg>`;
    return `<div class="grafiek" id="grafiek">${svg}<div class="tip" id="tip" hidden></div></div>`;
  }
  function koppelGrafiek(){
    const g = el("grafiek");
    if(!g) return;
    const tip = el("tip");
    const toon = kolom => {
      const m = grafiekData[Number(kolom.dataset.i)];
      if(!m) return;
      g.querySelectorAll(".kolom").forEach(k => k.classList.toggle("dim", k !== kolom));
      const box = kolom.querySelector(".hit").getBoundingClientRect(), gb = g.getBoundingClientRect();
      tip.innerHTML = `<b>${esc(periodLabel(m.p))}</b>
        <div class="r"><span><i style="background:${KLEUR.geh}"></i>Gehonoreerd</span>${esc(euro(m.geh))}</div>
        <div class="r"><span><i style="background:${KLEUR.open}"></i>Openstaand</span>${esc(euro(m.open))}</div>
        <div class="r"><span><i style="background:${KLEUR.afg}"></i>Afgewezen</span>${esc(euro(m.afg))}</div>
        <div class="r" style="margin-top:4px"><span>${meervoud(m.n, "claim", "claims")}</span><b style="margin:0">${esc(euro(m.geh + m.open + m.afg))}</b></div>`;
      tip.hidden = false;
      const x = Math.min(Math.max(box.left + box.width / 2 - gb.left, 100), gb.width - 100);
      tip.style.left = x + "px";
      tip.style.top = Math.round(box.top - gb.top + 4) + "px";
    };
    const weg = () => { tip.hidden = true; g.querySelectorAll(".kolom").forEach(k => k.classList.remove("dim")); };
    g.querySelectorAll(".kolom").forEach(k => {
      k.addEventListener("mouseenter", () => toon(k));
      k.addEventListener("click", () => toon(k));
    });
    g.addEventListener("mouseleave", weg);
  }

  /* ======================================================================
     DIALOGEN
     ====================================================================== */
  function openSheet(html, opties){
    const ov = document.createElement("div");
    ov.className = "overlay" + (opties && opties.paneel ? " zijpaneel" : "");
    ov.innerHTML = html;
    document.body.appendChild(ov);
    const vorigeFocus = document.activeElement;
    const sluit = () => { ov.remove(); document.removeEventListener("keydown", opEsc); if(vorigeFocus && vorigeFocus.focus) vorigeFocus.focus(); if(opties && opties.naSluiten) opties.naSluiten(); };
    function opEsc(e){ if(e.key === "Escape"){ e.stopPropagation(); sluit(); } }
    document.addEventListener("keydown", opEsc);
    ov.addEventListener("mousedown", e => { if(e.target === ov) sluit(); });
    ov.querySelectorAll("[data-sluit]").forEach(b => b.onclick = sluit);
    const eerste = ov.querySelector((opties && opties.focus) || "input,select,textarea,button.btn-primary");
    if(eerste) eerste.focus();
    return {ov, sluit, q: s => ov.querySelector(s)};
  }

  function maandOpties(huidig){
    const nu = new Date();
    const lijst = [];
    for(let i = -1; i < 24; i++){
      const d = new Date(nu.getFullYear(), nu.getMonth() - i, 1);
      lijst.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"));
    }
    state.claims.forEach(c => { if(isPeriode(c.periode) && !lijst.includes(c.periode)) lijst.push(c.periode); });
    const gekozen = isPeriode(huidig) ? huidig : thisPeriod();
    if(!lijst.includes(gekozen)) lijst.push(gekozen);
    return lijst.sort().reverse().map(p => `<option value="${esc(p)}"${p === gekozen ? " selected" : ""}>${esc(periodLabel(p))}</option>`).join("");
  }

  function prijsVoor(tekst){
    const t = String(tekst || "").toLowerCase();
    if(!t.trim()) return null;
    const lijst = (INST.prijzen || []).slice().sort((a, b) => b.woord.length - a.woord.length);
    return lijst.find(r => t.indexOf(String(r.woord).toLowerCase()) !== -1) || null;
  }

  function zoekDubbel(body, eigenId){
    const norm = s => String(s || "").toLowerCase().replace(/\s+/g, "");
    const titel = norm(body.type || body.onderdeel);
    const treffers = [];
    actief().forEach(c => {
      if(c.id === eigenId) return;
      if(body.inkoopnummer && norm(c.inkoopnummer) === norm(body.inkoopnummer)) treffers.push([c, "inkoopnummer " + body.inkoopnummer]);
      else if(body.frame && norm(c.frame) === norm(body.frame) && norm(c.type || c.onderdeel) === titel) treffers.push([c, "framenummer " + body.frame]);
      else if(body.voorziening && norm(c.voorziening) === norm(body.voorziening) && norm(c.type || c.onderdeel) === titel && isOpen(c))
        treffers.push([c, "voorzieningnummer " + body.voorziening]);
    });
    return treffers;
  }

          <option value="__anders"${anders ? " selected" : ""}>Anders…</option></select></label>
        <label id="f_lev_wrap" hidden>Nieuwe leverancier<input id="f_lev" value="${anders ? esc(c.leverancier) : ""}" placeholder="Naam van de leverancier"></label>
        <label>Aankoopdatum<input id="f_aankoop" value="${esc(aankoopVan(c))}" placeholder="03-11-2026"></label>

        <label>Uitbesteed<select id="f_uitbesteed">

          <option value="binnen"${c.locatie !== "buiten" ? " selected" : ""}>Binnenmonteur</option>

    const ruwBtn = q("#ruwBtn");
    if(ruwBtn){ const ruw = q("#ruwtekst"); ruwBtn.onclick = () => { ruw.hidden = !ruw.hidden; ruwBtn.textContent = ruw.hidden ? "tekst van het formulier" : "tekst verbergen"; }; }

    const bedragVeld = q("#f_bedrag"), hint = q("#f_bedrag_hint");
    let bedragZelf = bedragVeld.value.trim() !== "";

      };
      const melding = q("#f_melding");

      if(!body.onderdeel) ontbreekt.push("een onderdeel of type");

          ${dubbel.slice(0, 3).map(([d, waarom]) => `<br>· ${esc(waarom)}: <b>${esc(titelVan(d))}</b> (${esc(d.leverancier || "")}, ${esc(periodLabel(d.periode))}, ${esc(STATUS[statusVan(d)].label.toLowerCase())})`).join("")}

      }

  }

      const tekst = q("#n_tekst").value.trim();
      const datum = q("#n_datum").value || vandaag();
      const naar = q("#n_status").value;
      if(!tekst && !naar){ q("#n_tekst").focus(); return; }
      sluit();
      let nieuw = kopie(claim);
      if(tekst) nieuw.notities = [...(nieuw.notities || []), {...regel(tekst), d:datum}];
      if(naar) nieuw = metStatus(nieuw, naar);
      await bewaar([nieuw], naar ? "Notitie toegevoegd, status " + STATUS[naar].label.toLowerCase() : "Notitie toegevoegd", terugdraaier([kopie(claim)]));
    });
  }

  /* ---------- rappel aan een leverancier ---------- */
  function openRappel(lev){
    const open = actief().filter(c => (c.leverancier || "") === lev && isOpen(c))
      .sort((a, b) => String(a.datum || a.periode || "").localeCompare(String(b.datum || b.periode || "")));
    if(!open.length){ toast("Geen openstaande claims bij " + lev); return; }
    const som = open.reduce((t, c) => t + (Number(c.bedrag) || 0), 0);
    const regels = open.map(c => {
      const a = ageInfo(c);
      return "- " + titelVan(c) + (c.storing ? " (" + c.storing.replace(/\s+/g, " ").slice(0, 70) + ")" : "") +
        "\n  Inkoopnummer: " + (c.inkoopnummer || "volgt") + (c.voorziening ? " · Voorziening: " + c.voorziening : "") + (c.frame ? " · Frame: " + c.frame : "") +
        "\n  Ingediend: " + (c.datum ? fmtDate(c.datum) : periodLabel(c.periode)) + (a ? " (" + a.dagen + " dagen geleden)" : "") +
        (geenBedrag(c) ? "" : " · Bedrag: " + euro(c.bedrag));
    }).join("\n\n");
    const tekst = "Goedendag,\n\nVoor de volgende garantieclaims van Medipoint " + INST.vestiging.replace(/^vestiging\s+/i, "") +
      " hebben we nog geen honorering of creditering ontvangen:\n\n" + regels +
      "\n\nTotaal openstaand: " + euro(som) + " (" + meervoud(open.length, "claim", "claims") + ").\n\nKunt u laten weten wat de status is?\n\nMet vriendelijke groet,\n\nMedipoint " +
      INST.vestiging.replace(/^vestiging\s+/i, "");
    const onderwerp = "Openstaande garantieclaims Medipoint " + INST.vestiging.replace(/^vestiging\s+/i, "") + " — " + lev;
    const mail = INST.levMail[lev] || "";
    const {q, sluit} = openSheet(`<form class="sheet" id="rappelForm">
      <h2>Rappel aan ${esc(lev)}</h2>
      <div class="grid">
        <label class="full">Aan<input id="r_aan" type="email" value="${esc(mail)}" placeholder="garantie@leverancier.nl"></label>
        <label class="full">Onderwerp<input id="r_ond" value="${esc(onderwerp)}"></label>
        <label class="full">Bericht<textarea id="r_tekst" class="mailvoorbeeld">${esc(tekst)}</textarea></label>
        <label class="full vink"${magBewerken() ? "" : " hidden"}><input type="checkbox" id="r_notitie"${magBewerken() ? " checked" : ""}><span>Zet bij elke claim een notitie “Rappel gestuurd naar ${esc(lev)}”.</span></label>
      </div>
      <div class="sheet-actions">
        <button type="button" class="btn btn-ghost" data-sluit="1">Sluiten</button>
        <button type="button" class="btn" id="r_kopie">Tekst kopiëren</button>
        <button type="submit" class="btn btn-primary">Openen in e-mail</button>
      </div>
    </form>`, {focus:"#r_aan"});
    const naVersturen = async () => {
      const aan = q("#r_aan").value.trim();
      if(!magBewerken()) return;
      if(aan && aan !== mail){ INST.levMail = {...INST.levMail, [lev]: aan}; bewaarInst({levMail: INST.levMail}); }
      if(q("#r_notitie").checked){
        const nu = vandaag();
        await bewaar(open.map(c => ({...kopie(c), notities:[...(c.notities || []), {...regel("Rappel gestuurd naar " + lev), d:nu}]})), "Rappel genoteerd bij " + meervoud(open.length, "claim", "claims"));
      }
    };
    q("#r_kopie").onclick = async () => {
      try{ await navigator.clipboard.writeText(q("#r_ond").value + "\n\n" + q("#r_tekst").value); toast("Tekst gekopieerd"); }
      catch(e){ q("#r_tekst").select(); toast("Kopieer de geselecteerde tekst met Ctrl+C"); }
    };
    q("#rappelForm").addEventListener("submit", async e => {
      e.preventDefault();
      const href = "mailto:" + encodeURIComponent(q("#r_aan").value.trim()) + "?subject=" + encodeURIComponent(q("#r_ond").value) + "&body=" + encodeURIComponent(q("#r_tekst").value);
      window.location.href = href;
      sluit();
      await naVersturen();
    });
  }

        if(!m) return null;
