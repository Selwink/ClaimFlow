  /* ---------- export, back-up, afdrukken ---------- */
  function download(naam, inhoud, type){
    const blob = new Blob([inhoud], {type});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = naam;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  function csv(){
    const head = ["Nummer","Onderdeel","Voorzieningnummer","Type","Framenummer","Aankoopdatum","Leverancier","Status","Uitbesteed","Monteur","Bedrag",
      "Inkoopnummer","Ingediend op","Afgehandeld op","Doorlooptijd (dagen)","Periode","Omschrijving storing","Bijzonderheden","Notities"];
    const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    const rows = (state.view === "lijst" ? visible() : baseRows()).map(c => [c.nummer, c.onderdeel, c.voorziening, c.type, c.frame, aankoopVan(c), c.leverancier,
      STATUS[statusVan(c)].label, c.uitbesteed ? "Ja" : "Nee", c.locatie === "buiten" ? "Buitenmonteur" : "Binnenmonteur",
      geenBedrag(c) ? "" : String(c.bedrag).replace(".", ","), c.inkoopnummer, c.datum || "", afgehandeldOp(c) || "", doorlooptijd(c) ?? "",
      periodLabel(c.periode), c.storing, c.bijzonderheden,
      (Array.isArray(c.notities) ? c.notities.slice().sort((x, y) => String(x.d || "").localeCompare(String(y.d || ""))).map(n => (n.d || "") + ": " + (n.t || "")).join(" | ") : "")
    ].map(q).join(";"));
    return "﻿" + [head.map(q).join(";")].concat(rows).join("\r\n");
  }
  function backup(){
    download("garantieclaims-backup-" + vandaag() + ".json",
      JSON.stringify({app:"medipoint-garantieclaims", versie:2, gemaakt:new Date().toISOString(), instellingen:INST, claims:state.claims}, null, 2),
      "application/json");
    toast("Back-up gedownload (" + meervoud(state.claims.length, "claim", "claims") + ")");
  }
  function kiesBackup(){
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json"; inp.style.display = "none";
    document.body.appendChild(inp);
    inp.addEventListener("change", async () => {
      const f = inp.files && inp.files[0]; inp.remove();
      if(!f) return;
      let data;
      try{ data = JSON.parse(await f.text()); }catch(e){ toast("Dit is geen geldig back-upbestand"); return; }
      const lijst = (Array.isArray(data) ? data : data.claims || []).filter(c => c && c.id && String(c.id).charAt(0) !== "_");
      if(!lijst.length){ toast("Geen claims gevonden in dit bestand"); return; }
      const bestaand = new Set(state.claims.map(c => c.id));
      const nNieuw = lijst.filter(c => !bestaand.has(c.id)).length;
      const {q, sluit} = openSheet(`<div class="sheet"><h2>Back-up terugzetten</h2>
        <p>${esc(f.name)} bevat ${meervoud(lijst.length, "claim", "claims")}: ${nNieuw} nieuw en ${lijst.length - nNieuw} die al bestaan.
          Bestaande claims worden overschreven met de versie uit de back-up. Claims die niet in de back-up staan, blijven staan.</p>
        ${data.instellingen ? `<label class="vink"><input type="checkbox" id="b_inst"><span>Ook de instellingen terugzetten</span></label>` : ""}
        <div class="sheet-actions"><button type="button" class="btn btn-ghost" data-sluit="1">Annuleren</button>
          <button type="button" class="btn btn-primary" id="b_ok">Terugzetten</button></div></div>`);
      q("#b_ok").onclick = async () => {
        const metInst = q("#b_inst") && q("#b_inst").checked;
        sluit();
        await bewaar(lijst.map(c => ({...c, notities: Array.isArray(c.notities) ? c.notities : []})), meervoud(lijst.length, "claim", "claims") + " teruggezet");
        if(metInst) await bewaarInst(instUit(data.instellingen));
      };
    });
    inp.click();
  }

  /* ---------- herinneringen in de agenda (.ics) ---------- */
  function termijnDatum(c){
    const s0 = startDatum(c);
    if(!s0) return null;
    const d = dag(s0); d.setDate(d.getDate() + INST.dagen);
    return d;
  }
  const icsTekst = t => String(t || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  const icsDatum = d => d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
  function agendaBestand(claims){
    const morgen = new Date(); morgen.setHours(0, 0, 0, 0); morgen.setDate(morgen.getDate() + 1);
    const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
    const plaats = location.protocol.startsWith("http") ? location.origin + location.pathname : "";
    const events = claims.map(c => {
      let d = termijnDatum(c);
      if(!d) return null;
      const verlopen = d < morgen;
      if(verlopen) d = morgen;
      const titel = (verlopen ? "Garantieclaim over termijn: " : "Termijn garantieclaim: ") + titelVan(c) + (c.leverancier ? " (" + c.leverancier + ")" : "");
      const tekst = [
        "Inkoopnummer: " + (c.inkoopnummer || "nog niet bekend"),
        "Leverancier: " + (c.leverancier || "-"),
        geenBedrag(c) ? "" : "Bedrag: " + euro(c.bedrag),
        "Ingediend: " + (c.datum ? fmtDate(c.datum) : periodLabel(c.periode)),
        "Termijn: " + INST.dagen + " dagen. Stuur een rappel als er nog geen antwoord is.",
        plaats ? "Register: " + plaats : ""
      ].filter(Boolean).join("\n");
      return ["BEGIN:VEVENT", "UID:" + c.id + "-termijn@garantieclaims-medipoint", "DTSTAMP:" + stamp,
        "DTSTART:" + icsDatum(d) + "T090000", "DTEND:" + icsDatum(d) + "T091500",
        "SUMMARY:" + icsTekst(titel), "DESCRIPTION:" + icsTekst(tekst), plaats ? "URL:" + plaats : "",
        "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsTekst(titel), "TRIGGER:-PT0M", "END:VALARM", "END:VEVENT"].filter(Boolean).join("\r\n");
    }).filter(Boolean);
    if(!events.length){ toast("Geen open claims om een herinnering voor te maken"); return; }
    const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Medipoint//Garantieclaims//NL", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", ...events, "END:VCALENDAR"].join("\r\n");
    download(events.length === 1 ? "herinnering-garantieclaim.ics" : "herinneringen-garantieclaims.ics", ics, "text/calendar;charset=utf-8");
    toast(meervoud(events.length, "herinnering", "herinneringen") + " gemaakt — open het bestand om ze in je agenda te zetten");
  }

  /* ======================================================================

     ====================================================================== */
  const PDF_BRONNEN = ["https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/", "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/"];
  let pdfBelofte = null;
  function laadScript(src){
    return new Promise((ok, fout) => {
      const s = document.createElement("script");
      s.src = src; s.onload = () => ok(); s.onerror = () => fout(new Error("script niet geladen"));
      document.head.appendChild(s);
    });
  }
  function pdfLezer(){
    if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if(pdfBelofte) return pdfBelofte;
    pdfBelofte = (async () => {
      for(const basis of PDF_BRONNEN){
        try{
          await laadScript(basis + "pdf.min.js");
          if(!window.pdfjsLib) continue;
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = basis + "pdf.worker.min.js";
          return window.pdfjsLib;
        }catch(e){ /* volgende bron */ }
      }
      pdfBelofte = null;
      throw new Error("pdf-lezer niet beschikbaar");
    })();
    return pdfBelofte;
  }
  async function pdfTekst(file){
    const lib = await pdfLezer();
    const doc = await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()), isEvalSupported:false}).promise;
    let uit = "";
    for(let p = 1; p <= Math.min(doc.numPages, 12); p++){
      const inhoud = await (await doc.getPage(p)).getTextContent();
      let regel = "";
      inhoud.items.forEach(it => {
        regel += (it.str || "");
        if(it.hasEOL){ uit += regel.trim() + "\n"; regel = ""; } else regel += " ";
      });
      if(regel.trim()) uit += regel.trim() + "\n";
      uit += "\n";
    }
    return uit;
  }

  const VELDREGELS = [
    {k:"voorziening", labels:["voorzieningsnummer","voorzieningnummer","voorzienings?\\s*nr\\.?","voorziening\\s*nummer","voorziening"]},
    {k:"frame",       labels:["framenummer","frame\\s*nummer","frame\\s*nr\\.?","serienummer","serie\\s*nr\\.?","frame"]},
    {k:"type",        labels:["type\\s*hulpmiddel","hulpmiddel\\s*type","type\\s*/?\\s*model","typenummer","hulpmiddel","type"]},
    {k:"storing",     labels:["omschrijving\\s*(?:van\\s*)?(?:de\\s*)?storing","storing\\s*omschrijving","klachtomschrijving","omschrijving\\s*klacht","aard\\s*van\\s*de\\s*storing","storing","klacht","omschrijving"], lang:true},
    {k:"leverancier", labels:["leverancier","fabrikant","merk"]},
    {k:"nummer",      labels:["claimnummer","claim\\s*nr\\.?","garantienummer","werkordernummer","werkorder\\s*nr\\.?","werkorder","opdrachtnummer","meldingsnummer"]},
    {k:"inkoopnummer",labels:["inkoopnummer","inkoop\\s*nr\\.?","inkooporder","bestelnummer"]},
    {k:"aankoop",     labels:["aankoopdatum","datum\\s*van\\s*aankoop","datum\\s*aankoop","aanschafdatum","datum\\s*van\\s*aanschaf","leverdatum","afleverdatum","aankoop","aanschaf"]},
    {k:"onderdeel",   labels:["vervangen\\s*onderdeel","defect\\s*onderdeel","onderdeel\\s*omschrijving","onderdeel"]}
  ];
  const vlucht = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const EXTRA_LABELS = ["monteur","vestiging","datum","cli[eë]nt","klant","naam","adres","postcode","woonplaats",
    "telefoon","e-?mail","ondertekening","aanvrager","artikelnummer","aantal","bedrag","kosten","prijs","handtekening","paraaf"];
  const ALLE_LABELS = VELDREGELS.reduce((a, v) => a.concat(v.labels), []).concat(EXTRA_LABELS);
  const LABEL_REGEL = new RegExp("(?:^|[^a-z])(?:" + ALLE_LABELS.join("|") + ")\\s*(?:nr\\.?|nummer)?\\s*[:=]", "i");
  function snijd(waarde, eigen, alleenMetDubbelepunt){
    let kortste = waarde.length;
    ALLE_LABELS.forEach(l => {
      if(l === eigen) return;
      const staart = alleenMetDubbelepunt ? "\\s*(?:nr\\.?|nummer)?\\s*[:=]" : "(?:[^a-z]|$)";
      const m = waarde.match(new RegExp("(?:^|[^a-z])" + l + staart, "i"));
      if(!m || m.index == null) return;
      const i = m.index + (/^[^a-z]/i.test(m[0]) ? 1 : 0);
      if(i < kortste) kortste = i;
    });
    return waarde.slice(0, kortste).replace(/[\s:=,;.\-]+$/, "").trim();
  }
  function leesVelden(tekst){
    const T = String(tekst || "").replace(/\r/g, "");
    const regels = T.split("\n").map(r => r.replace(/\s+/g, " ").trim()).filter(r => r !== "");
    const uit = {};
    const isLabel = r => ALLE_LABELS.some(l => new RegExp("^\\s*(?:" + l + ")\\s*(?:nr\\.?|nummer)?\\s*[:=]?\\s*$", "i").test(r));
    VELDREGELS.forEach(v => {
      for(const lab of v.labels){
        const re = new RegExp("(?:^|[^a-z])" + lab + "\\s*[:=\\u2013-]?\\s*(.*)$", "i");
        for(let i = 0; i < regels.length; i++){
          const m = regels[i].match(re);
          if(!m) continue;
          const opRegel = (m[1] || "").trim();
          let waarde = opRegel;
          if(v.lang){
            const onder = regels[i + 1];
            const bruikbaar = (onder && !isLabel(onder) && !LABEL_REGEL.test(onder)) ? onder.trim() : "";
            waarde = bruikbaar || opRegel;
          } else if(!waarde && regels[i + 1] && !isLabel(regels[i + 1])){
            waarde = regels[i + 1].trim();
          }
          waarde = snijd(waarde, lab, !!v.lang);
          if(waarde && !isLabel(waarde)){ uit[v.k] = waarde.slice(0, 400); break; }
        }
        if(uit[v.k]) break;
      }
    });
    const bekend = alleLeveranciers();
    const match = bekend.find(l => new RegExp("(?:^|[^a-z])" + vlucht(l) + "(?:[^a-z]|$)", "i").test(T));
    if(match) uit.leverancier = match;
    else if(uit.leverancier) uit.leverancier = uit.leverancier.replace(/[.,;]$/, "").slice(0, 60);
    if(uit.aankoop){
      const d = (uit.aankoop.match(/\d{1,2}[-\/. ]\d{1,2}[-\/. ]\d{2,4}|\d{4}-\d{2}-\d{2}|(?:19|20)\d{2}/) || [])[0];
      if(d) uit.aankoop = d.trim(); else delete uit.aankoop;
    }
    ["nummer", "inkoopnummer"].forEach(k => {
      if(!uit[k]) return;
      const brok = (uit[k].match(/\d[\d.\-\/ ]{2,}\d|\d{4,}/) || [])[0];
      if(!brok){ delete uit[k]; return; }
      const delen = brok.split("/").map(s => s.replace(/\D/g, "")).filter(Boolean);
      const gekozen = k === "inkoopnummer" ? delen[delen.length - 1] : delen[0];
      if(gekozen) uit[k] = gekozen; else delete uit[k];
    });
    if(!uit.inkoopnummer){
      const paar = T.match(/(?:^|\D)(\d{5,})\s*\/\s*(\d{5,})(?:\D|$)/);
      if(paar) uit.inkoopnummer = paar[2];
    }
    if(uit.voorziening){
      const code = (uit.voorziening.match(/[A-Za-z]{0,4}[\-\s]?\d[\d.\-\/]{2,}/) || [])[0];
      if(code) uit.voorziening = code.trim();
      uit.voorziening = uit.voorziening.slice(0, 40);
    }
    if(uit.frame) uit.frame = uit.frame.split(" ").slice(0, 4).join(" ").slice(0, 40);
    if(uit.type) uit.type = uit.type.slice(0, 60);
    return uit;
  }
  async function leesFormulier(file){
    if(!magBewerken()){ alleenKijkenMelding(); return; }
    if(!file) return;
    const naam = (file.name || "formulier").toLowerCase();
    const isPdf = file.type === "application/pdf" || naam.endsWith(".pdf");
    const isTekst = /\.(txt|eml|csv|json|md|htm|html)$/.test(naam) || String(file.type || "").startsWith("text/");
    if(!isPdf && !isTekst){
      toast(String(file.type || "").startsWith("image/") ? "Van een foto kan ik de tekst niet lezen — sleep de pdf van het formulier" : "Dit bestand kan ik niet lezen — een pdf of tekstbestand wel");
      return;
    }
    toast("Formulier lezen…");
    let tekst = "";
    try{ tekst = isPdf ? await pdfTekst(file) : await file.text(); }
    catch(err){ toast("Het formulier kon niet gelezen worden — vul het zelf in"); openForm(null); return; }
    const velden = leesVelden(tekst);
    const aantal = Object.keys(velden).length;
    const bron = file.name || "formulier";
    if(INST.autoInvoer && aantal && velden.leverancier && (velden.type || velden.onderdeel)){
      const uitbesteed = INST.uitbesteedLev.includes(velden.leverancier || "");
      const status = uitbesteed ? "gehonoreerd" : "nieuw";
      const id = nieuwId();
      const nieuw = {
        id, onderdeel: velden.onderdeel || velden.type || "Onbekend onderdeel", voorziening: velden.voorziening || "", type: velden.type || "",
        frame: velden.frame || "", storing: velden.storing || "", nummer: velden.nummer || "", inkoopnummer: velden.inkoopnummer || "",
        leverancier: velden.leverancier || "", aankoop: velden.aankoop || "", bouwjaar:"",
        bedrag: (prijsVoor([velden.onderdeel, velden.type, velden.storing].filter(Boolean).join(" ")) || {}).bedrag ?? null,
        datum: vandaag(), periode: thisPeriod(), status, locatie:"binnen", uitbesteed,
        bijzonderheden: "Ingelezen uit " + bron,
        notities: [regel("Claim vastgelegd uit " + bron + " (" + STATUS[status].label.toLowerCase() + ")", {soort:"status", naar:status})]
      };
      const dubbel = zoekDubbel(nieuw, null);
      if(dubbel.length){ openForm(null, {velden, bron, tekst, aantal}); return; }
      state.expanded.add(id);
      await bewaar([nieuw], meervoud(aantal, "veld", "velden") + " ingelezen uit " + bron, terugdraaier([], id));
      return;
    }
    openForm(null, {velden, bron, tekst, aantal});
  }
  function kiesFormulier(){
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".pdf,.txt,.eml,.csv,.json,application/pdf,text/plain"; inp.style.display = "none";
    document.body.appendChild(inp);
    inp.addEventListener("change", () => { const f = inp.files && inp.files[0]; inp.remove(); if(f) leesFormulier(f); });
    inp.click();
  }
  (function sleepZone(){
    const zone = document.createElement("div");
    zone.className = "sleepzone"; zone.hidden = true;
    zone.innerHTML = '<div class="sleepkaart"><b>Laat het formulier hier vallen</b><span></span></div>';
    document.body.appendChild(zone);
    let diep = 0;
    const heeftBestand = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).indexOf("Files") !== -1;
    window.addEventListener("dragenter", e => {
      if(!heeftBestand(e) || !el("gate").hidden) return;
      e.preventDefault(); diep++;
      zone.querySelector("span").textContent = INST.autoInvoer
        ? "Een pdf of tekstbestand — de claim wordt meteen toegevoegd, het bedrag vul je later aan."

  /* ---------- meldingen ---------- */
  let toastTimer = null;
  function toast(msg, ongedaan){

  /* ======================================================================

  async function voerUit(act, id){
    const c = id ? state.claims.find(x => x.id === id) : null;
    switch(act){
      case "ingediend": case "gehonoreerd": case "afgewezen": await zetStatus([id], act); break;
      case "heropenen": await zetStatus([id], "ingediend"); break;
      case "notitie": openNote(c); break;
      case "bewerken": openForm(c); break;
      case "dupliceren": {
        const {id:_i, notities:_n, inkoopnummer:_k, nummer:_nr, frame:_f, voorziening:_v, verwijderd:_d, bijgewerkt:_b, datum:_dt, ...rest} = c;
        openForm(null, null, {...rest, status:"nieuw", periode:thisPeriod(), bijzonderheden:""});
        break;
      }
      case "bevestig": await naarPrullenbak([id]); break;
      case "agenda": agendaBestand([c]); break;
      case "terugzetten": await terugzetten(id); break;
      case "purge": state.confirmId = id; render(); break;
      case "purgeok": await purge(id); break;
      case "annuleren": state.confirmId = null; render(); break;
      case "allesTonen":
        Object.assign(state, {period:"all", status:"", q:"", loc:"", lev:"", uit:""});
        syncFilterVelden(); bewaarWeergave(); render(); break;
    }
  }
  /* vegen: blok naar links schuiven toont snelle acties */
  let veeg = null, openVeeg = null, geenKlikTot = 0;
  const actieBreedte = b => { const a = b.parentElement && b.parentElement.querySelector(".blok-acties"); return a ? a.offsetWidth : 0; };
  function sluitVeeg(){ if(openVeeg){ openVeeg.style.transform = ""; openVeeg.classList.remove("open"); openVeeg = null; } }
  el("list").addEventListener("pointerdown", e => {
    const b = e.target.closest(".blok");
    if(!b || state.selecteren || !magBewerken() || (e.pointerType === "mouse" && e.button !== 0) || !actieBreedte(b)) return;
    if(openVeeg && openVeeg !== b) sluitVeeg();
    veeg = {b, x:e.clientX, y:e.clientY, actief:false, start: openVeeg === b ? -actieBreedte(b) : 0, pos:0, id:e.pointerId};
  });
  window.addEventListener("pointermove", e => {
    if(!veeg || e.pointerId !== veeg.id) return;
    const dx = e.clientX - veeg.x, dy = e.clientY - veeg.y;
    if(!veeg.actief){
      if(Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.3){ veeg.actief = true; veeg.b.classList.add("sleep"); try{ veeg.b.setPointerCapture(e.pointerId); }catch(err){} }
      else if(Math.abs(dy) > 12){ veeg = null; return; }
      else return;
    }
    const max = actieBreedte(veeg.b);
    veeg.pos = Math.min(0, Math.max(-max - 24, veeg.start + dx));
    veeg.b.style.transform = `translateX(${veeg.pos}px)`;
  });
  const veegKlaar = () => {
    if(!veeg) return;
    const v = veeg; veeg = null;
    if(!v.actief) return;
    v.b.classList.remove("sleep");
    geenKlikTot = Date.now() + 350;
    const max = actieBreedte(v.b);
    if(v.pos < -max / 2){ v.b.style.transform = `translateX(${-max}px)`; v.b.classList.add("open"); openVeeg = v.b; ls.set("claimregister-veegtip", "1"); }
    else { v.b.style.transform = ""; v.b.classList.remove("open"); if(openVeeg === v.b) openVeeg = null; }
  };
  window.addEventListener("pointerup", veegKlaar);
  window.addEventListener("pointercancel", veegKlaar);
  document.addEventListener("click", e => { if(openVeeg && !e.target.closest(".blok-wrap")) sluitVeeg(); });

  el("list").addEventListener("keydown", e => {
    const tr = e.target.closest("tr[data-card]");
    if(tr && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); tr.click(); }
  });
  el("list").addEventListener("click", async e => {
    if(Date.now() < geenKlikTot){ e.preventDefault(); return; }
    const th = e.target.closest("[data-sorteer]");
    if(th){
      const k = th.dataset.sorteer;
      if(state.sort === k) state.sortOm = !state.sortOm; else { state.sort = k; state.sortOm = false; }
      el("fSort").value = state.sort; bewaarWeergave(); render(); return;
    }
    const snel = e.target.closest("tr[data-card] button[data-act]");
    if(snel){ await voerUit(snel.dataset.act, snel.dataset.id); return; }
    const blok = e.target.closest("[data-card]");
    if(blok && blok === openVeeg){ sluitVeeg(); return; }
    if(blok){
      const id = blok.dataset.card;
      if(state.selecteren){ if(state.geselecteerd.has(id)) state.geselecteerd.delete(id); else state.geselecteerd.add(id); render(); }
      else openDetail(id);
      return;
    }
    const t = e.target.closest("button[data-act]");
    if(t) await voerUit(t.dataset.act, t.dataset.id);
  });
  document.addEventListener("click", e => {
    const m = e.target.closest("button[data-mail]");
    if(m){ e.preventDefault(); openRappel(m.dataset.mail); return; }
    const w = e.target.closest("button[data-act='tabelwissel']");
    if(w){ state.tabel = !state.tabel; render(); }
  });
  el("q").addEventListener("input", e => { state.q = e.target.value; render(); });
  el("dagmelding").addEventListener("click", e => {
    const b = e.target.closest("[data-dag]");
    if(!b) return;
    if(b.dataset.dag === "bekijk"){ Object.assign(state, {status:"aandacht", period:"all", trash:false}); bewaarWeergave(); }
    state.dagmelding = null; render();
  });
  el("teller").addEventListener("click", e => {
    const t = e.target.closest("button[data-tab]");
    if(!t) return;
    state.status = t.dataset.tab; bewaarWeergave(); render();
  });
  el("filterBtn").addEventListener("click", () => {
    const open = el("filters").hidden;
    el("filters").hidden = !open;
    el("filterBtn").setAttribute("aria-expanded", String(open));
  });
  el("fLoc").addEventListener("change", e => { state.loc = e.target.value; bewaarWeergave(); render(); });
  el("fLev").addEventListener("change", e => { state.lev = e.target.value; bewaarWeergave(); render(); });
  el("fUit").addEventListener("change", e => { state.uit = e.target.value; bewaarWeergave(); render(); });
  el("fSort").addEventListener("change", e => { state.sortOm = false; state.sort = e.target.value; bewaarWeergave(); render(); });
  el("fGroep").addEventListener("change", e => { state.groep = e.target.value; bewaarWeergave(); render(); });
  el("wisFilters").addEventListener("click", () => {
    Object.assign(state, {q:"", loc:"", lev:"", uit:"", sort:"standaard", groep:"maand"});
    syncFilterVelden(); bewaarWeergave(); render();
  });
  el("trashBtn").addEventListener("click", () => { state.trash = !state.trash; state.confirmId = null; state.selecteren = false; render(); window.scrollTo({top:0}); });
  /* ---------- LGAR: formulier invullen of bestand inlezen ---------- */
  const SLEUTEL_LGAR = "claimregister-lgar-open";
  function lgarKeuze(){
    const {q, sluit} = openSheet(`<div class="sheet lgarkeuze"><h2>Claim toevoegen</h2>
      <button type="button" class="keuze" id="lk_invullen"><b>LGAR-formulier invullen</b>
        <span>Opent het Microsoft-formulier. Na het versturen zet je de claim hier met één tik in de lijst.</span></button>
      <button type="button" class="keuze" id="lk_bestand"><b>LGAR-pdf of bestand inlezen</b>
        <span>Kies een LGAR-pdf of tekstbestand; de app haalt de gegevens eruit.</span></button>
      <button type="button" class="keuze" id="lk_zelf"><b>Zelf invullen</b>
        <span>Een leeg claimformulier, bijvoorbeeld voor uitbesteed werk zonder LGAR.</span></button>
      <div class="sheet-actions"><button type="button" class="btn btn-ghost" data-sluit="1">Annuleren</button></div></div>`, {focus:"#lk_invullen"});
    q("#lk_invullen").onclick = () => { sluit(); lgarInvullen(); };
    q("#lk_bestand").onclick = () => { sluit(); kiesFormulier(); };
    q("#lk_zelf").onclick = () => { sluit(); openForm(null); };
  }
  function lgarInvullen(){
    ls.set(SLEUTEL_LGAR, String(Date.now()));
    const venster = window.open(LGAR_FORMULIER, "_blank");
    if(venster){ try{ venster.opener = null; }catch(e){} }
    else {
      // Pop-up geblokkeerd: dan in hetzelfde tabblad; bij terugkomst vraagt de app het alsnog.
      window.location.href = LGAR_FORMULIER;
    }
  }
  let lgarVraagOpen = false;
  function lgarTerug(){
    if(!magBewerken()) return;
    const sinds = Number(ls.get(SLEUTEL_LGAR) || 0);
    if(!sinds || lgarVraagOpen || !el("gate").hidden || document.hidden) return;
    if(Date.now() - sinds > 12 * 3600 * 1000){ ls.del(SLEUTEL_LGAR); return; }
    if(Date.now() - sinds < 4000) return;
    if(document.querySelector(".overlay")) return;
    lgarVraagOpen = true;
    const {q, sluit} = openSheet(`<div class="sheet"><h2>LGAR-formulier verstuurd?</h2>
      <p style="margin:0 0 6px;color:var(--ink-soft)">Je hebt het LGAR-formulier geopend. Heb je het verstuurd, zet de claim dan meteen in de lijst.
        Status en datum staan al goed; vul type, leverancier en inkoopnummer in.</p>
      <div class="sheet-actions">
        <button type="button" class="btn btn-ghost" id="lt_nee">Niet verstuurd</button>
        <button type="button" class="btn" id="lt_later">Nog bezig</button>
        <button type="button" class="btn btn-primary" id="lt_ja">Ja, claim vastleggen</button>
      </div></div>`, {focus:"#lt_ja", naSluiten: () => { lgarVraagOpen = false; }});
    q("#lt_nee").onclick = () => { ls.del(SLEUTEL_LGAR); sluit(); };
    q("#lt_later").onclick = () => { ls.set(SLEUTEL_LGAR, String(Date.now())); sluit(); };
    q("#lt_ja").onclick = () => {
      ls.del(SLEUTEL_LGAR); sluit();
      openForm(null, null, {status:"ingediend", periode:thisPeriod(), leverancier: state.lev || ""},
        {titel:"Claim na LGAR-formulier", notitie:"na het versturen van het LGAR-formulier",
         melding:"Het LGAR-formulier is verstuurd op <b>" + esc(fmtDate(vandaag())) + "</b>. Vul dezelfde gegevens in als op het formulier."});
    };
  }
  window.addEventListener("focus", () => setTimeout(lgarTerug, 300));
  document.addEventListener("visibilitychange", () => setTimeout(lgarTerug, 300));
  document.addEventListener("click", e => {
    const a = e.target.closest("[data-lgar-invullen]");
    if(!a) return;
    e.preventDefault();
    const ov = a.closest(".overlay"); if(ov) ov.remove();
    lgarInvullen();
  });
  el("addBtn").addEventListener("click", lgarKeuze);
  el("selectBtn").addEventListener("click", () => { if(state.selecteren) stopSelecteren(); else { state.selecteren = true; render(); } });
  document.querySelectorAll(".tabbar [data-view]").forEach(b => b.addEventListener("click", () => {
    state.view = b.dataset.view; state.trash = false; if(state.view === "rapport") state.selecteren = false; render(); window.scrollTo({top:0});
  }));

  (function menu(){
    const knop = el("menuBtn"), paneel = el("menuPaneel");
    const zet = open => { paneel.hidden = !open; knop.setAttribute("aria-expanded", String(open)); };
    knop.addEventListener("click", e => { e.stopPropagation(); zet(paneel.hidden); });
    document.addEventListener("click", e => { if(!e.target.closest(".menu")) zet(false); });
    document.addEventListener("keydown", e => { if(e.key === "Escape") zet(false); });
    paneel.addEventListener("click", e => {
      const b = e.target.closest("[data-menu]");
      if(!b) return;
      if(b.dataset.menu !== "thema") zet(false);
      switch(b.dataset.menu){
        case "uitleg": openUitleg(); break;
        case "instellingen": openInstellingen(); break;
        case "updates": openUpdates(); break;
        case "csv": download("garanties-medipoint-" + INST.vestiging.replace(/^vestiging\s+/i, "").toLowerCase().replace(/\s+/g, "-") + ".csv", csv(), "text/csv;charset=utf-8"); break;
        case "afdrukken": setTimeout(() => window.print(), 50); break;
        case "backup": backup(); break;
        case "terugzetten": kiesBackup(); break;
        case "thema": { const nu = ls.get(SLEUTEL_THEMA) || "dark"; zetThema(THEMAS[(THEMAS.indexOf(nu) + 1) % THEMAS.length]); break; }
        case "uitloggen": uitloggen(); break;
        case "agenda": openAgenda(); break;
        case "beheer": magBewerken() ? naarKijken() : openBeheerLogin(); break;
        case "installeren": installeren(); break;
      }
    });
  })();


  /* ======================================================================
     TOEGANGSSCHERM EN START
     ====================================================================== */
  function toonGate(melding){
    const gate = el("gate");
    gate.hidden = false;
    const vest = INST.vestiging.replace(/^vestiging\s+/i, "");
    gate.innerHTML = `<div class="gate-streep" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="gate-inhoud">
      <svg class="gate-embleem" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="57" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3"/>
        <circle cx="60" cy="60" r="48" fill="#d9342a"/>
        <path d="M60 32 38 40v17c0 13.5 9.4 25 22 28.5 12.6-3.5 22-15 22-28.5V40z" fill="#fff"/>
        <path d="m49.5 59 7.5 7.5 14-15" fill="none" stroke="#d9342a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="merk">medipoint</span>
      <h1>garantieclaims</h1>
      <p class="gate-vest">Vestiging ${esc(vest)}</p>
      <form class="gate-kaart" id="gateForm" novalidate>
        <p class="gate-uitleg">${CONFIG.ACCOUNTS ? "Log in met je account." : CONFIG.BEHEER_HASH ? "Vul het wachtwoord in. Met het beheerderswachtwoord kun je ook claims toevoegen en aanpassen." : "Vul het wachtwoord in om het register te openen."}</p>
        ${CONFIG.ACCOUNTS ? `<label class="gate-veld"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>
          <input type="email" id="gateMail" placeholder="E-mailadres" autocomplete="username" aria-label="E-mailadres" value="${esc((sessie && sessie.email) || ls.get("claimregister-laatste-mail") || "")}"></label>` : ""}
        <label class="gate-veld"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="gatePw" placeholder="Wachtwoord" autocomplete="current-password" aria-label="Wachtwoord">
          <button type="button" class="gate-oog" id="gateOog" aria-label="Wachtwoord tonen" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></label>
        <span class="fout" id="gateFout" role="alert"${melding ? "" : " hidden"}>${esc(melding || "")}</span>
        <div class="gate-rij">
          <button type="submit" class="grote-knop gate-knop">Inloggen</button>
          <button type="button" class="gate-vergeten" id="gateVergeten" aria-expanded="false">Wachtwoord vergeten?</button>
        </div>
        <p class="gate-tip" id="gateTip" hidden>${CONFIG.ACCOUNTS ? "Vraag je leidinggevende om je wachtwoord opnieuw in te stellen in Supabase." : "Het wachtwoord is voor de hele vestiging hetzelfde. Vraag het aan je leidinggevende of een collega."}</p>
        <button type="button" class="gate-tweede" id="gateInstall">App installeren</button>
      </form>
      <span class="gate-voet">Made by <b>Selwin</b></span>
    </div>`;
    el("gateVergeten").onclick = () => {
      const tip = el("gateTip"); tip.hidden = !tip.hidden;
      el("gateVergeten").setAttribute("aria-expanded", String(!tip.hidden));
    };
    el("gateInstall").onclick = () => installeren();
    if(isStandalone()) el("gateInstall").hidden = true;
    el("gateOog").onclick = () => {
      const pw = el("gatePw"), zicht = pw.type === "password";
      pw.type = zicht ? "text" : "password";
      el("gateOog").setAttribute("aria-pressed", String(zicht));
      el("gateOog").setAttribute("aria-label", zicht ? "Wachtwoord verbergen" : "Wachtwoord tonen");
      pw.focus();
    };
    const mailVeld = el("gateMail"), pwVeld = el("gatePw");
    (mailVeld && !mailVeld.value ? mailVeld : pwVeld).focus();
    el("gateForm").addEventListener("submit", async e => {
      e.preventDefault();
      const fout = el("gateFout"), knop = e.target.querySelector("button[type=submit]");
      fout.hidden = true;
      if(!pwVeld.value){ pwVeld.focus(); return; }
      if(CONFIG.ACCOUNTS){
        knop.disabled = true; knop.textContent = "Bezig…";
        try{
          bewaarSessie(await authAanvraag("password", {email:mailVeld.value.trim(), password:pwVeld.value}));
          ls.set("claimregister-laatste-mail", mailVeld.value.trim());
          openApp();
        }catch(err){
          fout.textContent = /invalid|credentials/i.test(err.message) ? "E-mailadres of wachtwoord klopt niet." : "Inloggen lukt niet: " + err.message;
          fout.hidden = false; pwVeld.value = ""; pwVeld.focus();
        }finally{ knop.disabled = false; knop.textContent = "Inloggen"; }
      } else {
        const h = await sha(pwVeld.value + ZOUT);
        if(h && (h === CONFIG.WACHTWOORD_HASH || (CONFIG.BEHEER_HASH && h === CONFIG.BEHEER_HASH))){
          ls.set(SLEUTEL_PW, h); openApp();
          if(CONFIG.BEHEER_HASH) toast(h === CONFIG.BEHEER_HASH ? "Ingelogd als beheerder" : "Ingelogd — alleen kijken");
        }
        else {
          fout.textContent = h ? "Dat wachtwoord klopt niet. Probeer het nog eens." : "Deze browser kan het wachtwoord niet controleren. Open de site via https.";
          fout.hidden = false; pwVeld.value = ""; pwVeld.focus();
          const kaart = el("gateForm"); kaart.classList.remove("schud"); void kaart.offsetWidth; kaart.classList.add("schud");
        }
      }
    });
  }
  function uitloggen(melding){
    if(CONFIG.ACCOUNTS){
      if(sessie && REMOTE){ kop().then(h => fetch(BASE + "/auth/v1/logout", {method:"POST", headers:h})).catch(() => {}); }
      bewaarSessie(null);
    } else ls.del(SLEUTEL_PW);
    ls.del(SLEUTEL_CACHE);
    state.claims = []; state.live = false;
    clearInterval(ververser);
    document.querySelectorAll(".overlay").forEach(o => o.remove());
    render();
    toonGate(melding);
  }

  function openBeheerLogin(){
    const {q, sluit} = openSheet(`<form class="sheet" id="beheerForm"><h2>Inloggen als beheerder</h2>
      <p style="margin:0 0 12px;color:var(--ink-soft)">Met het beheerderswachtwoord kun je claims toevoegen, aanpassen, afhandelen en verwijderen.</p>
      <div class="grid"><label class="full">Beheerderswachtwoord<input type="password" id="bh_pw" autocomplete="current-password" required></label></div>
      <div id="bh_fout"></div>
      <div class="sheet-actions"><button type="button" class="btn btn-ghost" data-sluit="1">Annuleren</button>
        <button type="submit" class="btn btn-primary">Inloggen</button></div></form>`, {focus:"#bh_pw"});
    q("#beheerForm").addEventListener("submit", async e => {
      e.preventDefault();
      const h = await sha(q("#bh_pw").value + ZOUT);
      if(h && h === CONFIG.BEHEER_HASH){ ls.set(SLEUTEL_PW, h); sluit(); render(); toast("Je bent nu beheerder"); setTimeout(vraagNaam, 600); }
      else { q("#bh_fout").innerHTML = `<div class="confirm" style="margin-top:12px">Dat is niet het beheerderswachtwoord.</div>`; q("#bh_pw").value = ""; q("#bh_pw").focus(); }
    });
  }
  function naarKijken(){
    ls.set(SLEUTEL_PW, CONFIG.WACHTWOORD_HASH);
    state.selecteren = false; state.geselecteerd.clear();
    document.querySelectorAll(".overlay").forEach(o => o.remove());
    render(); toast("Je kijkt nu alleen mee");
  }
  function renderRol(){
    const beheer = magBewerken();
    document.body.classList.toggle("alleen-kijken", !beheer);
    const item = el("beheerItem");
    item.hidden = CONFIG.ACCOUNTS || !CONFIG.BEHEER_HASH;
    item.textContent = beheer ? "Beheer verlaten (alleen kijken)" : "Inloggen als beheerder";
    const lbl = el("rolLabel");
    lbl.hidden = CONFIG.ACCOUNTS || !CONFIG.BEHEER_HASH;
    lbl.textContent = beheer ? "Beheer" : "Kijken";
    lbl.title = beheer ? "Je kunt claims toevoegen en aanpassen" : "Alleen kijken: log in als beheerder via het Menu om te wijzigen";
    lbl.className = "rol-label " + (beheer ? "rol-beheer" : "rol-kijken");
  }

  function vraagNaam(){
    if(!magBewerken()) return;
    if(CONFIG.ACCOUNTS || ls.get(SLEUTEL_NAAM) || sessionStorage.getItem("claimregister-naam-later")) return;
    if(document.querySelector(".overlay") || !el("gate").hidden){ setTimeout(vraagNaam, 1500); return; }
    const {q, sluit} = openSheet(`<form class="sheet" id="naamForm"><h2>Hoe heet je?</h2>
      <p style="margin:0 0 12px;color:var(--ink-soft)">Je naam komt in de tijdlijn bij alles wat je doet, zodat collega's zien wie een claim heeft ingediend, bijgewerkt of afgehandeld. Je kunt hem later wijzigen bij Instellingen.</p>
      <div class="grid"><label class="full">Naam<input id="nm_naam" autocomplete="given-name" placeholder="Bijv. Selwin" required></label></div>
      <div class="sheet-actions"><button type="button" class="btn btn-ghost" id="nm_later">Later</button>
        <button type="submit" class="btn btn-primary">Opslaan</button></div></form>`, {focus:"#nm_naam"});
    q("#nm_later").onclick = () => { try{ sessionStorage.setItem("claimregister-naam-later", "1"); }catch(e){} sluit(); };
    q("#naamForm").addEventListener("submit", e => {
      e.preventDefault();
      const n = q("#nm_naam").value.trim();
      if(!n) return;
      ls.set(SLEUTEL_NAAM, n); sluit(); toast("Hallo " + n + "!");
    });
  }

  let ververser = null;
  function openApp(){
    const gate = el("gate");
    gate.hidden = true; gate.innerHTML = "";
    setTimeout(lgarTerug, 800);
    setTimeout(vraagNaam, 1200);
    el("uitlogItem").hidden = el("uitlogScheiding").hidden = !(CONFIG.ACCOUNTS || CONFIG.WACHTWOORD_HASH);
    if(REMOTE){
      const cache = ls.json(SLEUTEL_CACHE);
      if(cache && Array.isArray(cache.claims)){
        state.claims = cache.claims; state.cacheTijd = cache.tijd;
        if(cache.inst) INST = instUit(cache.inst);
      }
      syncFilterVelden();
      render();
      refresh().then(syncFilterVelden);
      clearInterval(ververser);
      ververser = setInterval(() => { if(!document.hidden) refresh(); }, 20000);
    } else {
      const saved = ls.json(SLEUTEL_LOKAAL);
      const inst = ls.json(SLEUTEL_LOKAAL_INST);
      if(inst) INST = instUit(inst);
      if(Array.isArray(saved)) state.claims = saved;
      state.loaded = true;
      setTimeout(dagCheck, 0);
      if(!saved) banner("Nog geen database ingesteld. Claims worden bewaard in deze browser, op dit apparaat. Vul in CONFIG de SUPABASE_URL en SUPABASE_KEY in om de lijst te delen.");
      syncFilterVelden();
      render();
    }
  }
  document.addEventListener("visibilitychange", () => { if(!document.hidden && el("gate").hidden) refresh(); });
  setTimeout(lgarTerug, 800);

  (function meetKop(){
    const kopEl = document.querySelector("header.brandbar");
    const zet = () => document.documentElement.style.setProperty("--kophoogte", kopEl.offsetHeight + "px");
    zet();
    if(window.ResizeObserver) new ResizeObserver(zet).observe(kopEl);
  })();

  // Start
  pasInstToe();
  const toegang = rol() !== null;
  if(toegang) openApp(); else { render(); toonGate(); }
})();
</script>
</body>
</html>
