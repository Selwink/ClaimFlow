<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Garantieclaims Medipoint Meppel</title>
<script>try{var t=localStorage.getItem("claimregister-thema-donker")||"dark";if(t!=="auto")document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1b1e21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Garantieclaims">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Garantieclaimregister van Medipoint">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: merkbalk met logo bovenaan, daaronder periodepillen, vier kengetallenkaarten en een kolom claimkaarten; formulier als schuiflaag. */
:root{
  --bg:#f6f7f8;
  --surface:#ffffff;
  --surface-2:#f0f1f2;
  --ink:#22262a;
  --ink-soft:#656d75;
  --line:#dcdfe2;
  --brand:#ffffff;
  --brand-deep:#22262a;
  --on-brand:#22262a;
  --rood:#e8382b;
  --accent:#e8382b;
  --on-accent:#ffffff;
  --donker:#22262a;
  --op-donker:#ffffff;
  --ok:#1f9e96; --ok-soft:#e3f4f3;
  --warn:#9a6a00; --warn-soft:#fdf1da;
  --geel:#8a6100; --geel-soft:#fdf4e2; --geel-rand:#efb13c;
  --bad:#d02a1e; --bad-soft:#fdecea;
  --alarm:#d02a1e; --alarm-ink:#ffffff;
  --info:#2e4057; --info-soft:#e8ecf2;
  --shadow:none;
  --zweef:0 10px 28px rgba(34,38,42,.14);
  --display:'Figtree','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono','SFMono-Regular',Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141719; --surface:#1e2225; --surface-2:#282d31;
    --ink:#e9ebec; --ink-soft:#9aa2a9; --line:#333a40;
    --brand:#1e2225; --brand-deep:#0e1113; --on-brand:#e9ebec;
    --rood:#ff6a5c; --accent:#ff6a5c; --on-accent:#2a0d0a;
    --donker:#e9ebec;
    --op-donker:#141719;
    --ok:#4fc9bd; --ok-soft:#10312f;
    --warn:#e2b55f; --warn-soft:#332b18;
    --geel:#efc375; --geel-soft:#332b18; --geel-rand:#8a6d2e;
    --bad:#ff7a6d; --bad-soft:#3a1d1a;
    --alarm:#8f2a22; --alarm-ink:#ffece9;
    --info:#8ea9c9; --info-soft:#1e2630;
    --shadow:none;
    --zweef:0 10px 28px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141719; --surface:#1e2225; --surface-2:#282d31;
  --ink:#e9ebec; --ink-soft:#9aa2a9; --line:#333a40;
  --brand:#1e2225; --brand-deep:#0e1113; --on-brand:#e9ebec;
  --rood:#ff6a5c; --accent:#ff6a5c; --on-accent:#2a0d0a;
  --donker:#e9ebec;
  --op-donker:#141719;
  --ok:#4fc9bd; --ok-soft:#10312f;
  --warn:#e2b55f; --warn-soft:#332b18;
  --geel:#efc375; --geel-soft:#332b18; --geel-rand:#8a6d2e;
  --bad:#ff7a6d; --bad-soft:#3a1d1a;
  --alarm:#8f2a22; --alarm-ink:#ffece9;
  --info:#8ea9c9; --info-soft:#1e2630;
  --shadow:none;
  --zweef:0 10px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.42;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
.brandbar .site h1{color:var(--ink)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* toegangsscherm */
#gate{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#gate .kaart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:26px 22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;text-align:center}
#gate .merk{font-family:var(--display);font-weight:700;font-size:1.4rem;letter-spacing:-.03em;color:var(--rood);
  text-transform:lowercase;line-height:1}
#gate h1{font-family:var(--display);font-weight:700;font-size:1rem;margin:0;letter-spacing:-.01em}
#gate p{margin:0;font-size:.84rem;color:var(--ink-soft);line-height:1.45}
#gate input{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;
  font-size:1rem;color:var(--ink);text-align:center;width:100%}
#gate .fout{color:var(--bad);font-size:.82rem;font-weight:600}
#gate .streep{display:flex;height:5px;border-radius:999px;overflow:hidden}
#gate .streep i{display:block;height:100%}

/* merkbalk */
header.brandbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;color:var(--on-brand);
  background:var(--brand);box-shadow:0 4px 14px rgba(34,38,42,.07)}
.strip{display:flex;height:10px}
.strip i{display:block;height:100%}
.strip i:nth-child(1){flex:0 0 10%;background:#f7cbd1}
.strip i:nth-child(2){flex:0 0 10%;background:#5fc4c0}
.strip i:nth-child(3){flex:0 0 10%;background:#2e4057}
.strip i:nth-child(4){flex:0 0 11%;background:#efb13c}
.strip i:nth-child(5){flex:1 1 auto;background:var(--rood)}
.byline{font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);
  padding-block:5px 0;font-weight:600}
.byline b{color:var(--rood);font-weight:700}
.brandbar-inner{padding-block:9px;display:flex;align-items:center;gap:11px;flex-wrap:nowrap}
.mark{display:flex;align-items:center;gap:10px;min-width:0}
.wordmark{font-family:var(--display);font-weight:700;font-size:1.14rem;letter-spacing:-.03em;line-height:1;color:var(--rood);text-transform:lowercase}
.site{min-width:0;flex:1 1 auto}
.site h1{font-family:var(--display);font-weight:600;font-size:.92rem;margin:0;line-height:1.2;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site p{margin:1px 0 0;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.divider{width:1px;align-self:stretch;background:var(--line);margin-inline:2px}
.bar-tools{display:flex;gap:6px;margin-left:auto;align-items:center;flex:0 0 auto}
@media (max-width:520px){
  .brandbar-inner{gap:9px}
  .mark{flex:0 0 auto}
  .wordmark{font-size:1rem}
  .divider{display:none}
  .site p{display:none}
  .ghost-on-brand,.solid-on-brand{padding:8px 13px;font-size:.8rem}
}
.ghost-on-brand{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 20px;font-size:.86rem;font-weight:700;cursor:pointer}
.ghost-on-brand:hover{border-color:var(--ink)}
.solid-on-brand{border:2px solid var(--donker);background:var(--donker);color:var(--op-donker);border-radius:999px;padding:9px 20px;font-size:.86rem;font-weight:700;cursor:pointer}
.solid-on-brand:hover{filter:brightness(1.25)}
.solid-on-brand[disabled]{opacity:.5;cursor:not-allowed}

/* menu */
.menu{position:relative}
.menupaneel{position:absolute;right:0;top:calc(100% + 7px);z-index:40;min-width:186px;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--zweef);
  padding:5px;display:flex;flex-direction:column}
.menu-item{border:0;background:transparent;color:var(--ink);text-align:left;border-radius:9px;
  padding:10px 13px;font-size:.87rem;font-weight:600;cursor:pointer;white-space:nowrap}
.menu-item:hover{background:var(--surface-2)}

/* periodes */
.periodbar{background:var(--surface);border-bottom:1px solid var(--line)}
.periodrow{display:flex;align-items:center;gap:10px;min-width:0}
.periods{display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:none;flex:1 1 auto;min-width:0}
.updates{display:flex;flex-direction:column;gap:18px;margin:0}
.upd{display:flex;flex-direction:column;gap:7px}
.upd-datum{font-family:var(--display);font-weight:700;font-size:.82rem;letter-spacing:-.01em;
  display:flex;align-items:center;gap:9px}
.upd-datum::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}
.upd ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.86rem;line-height:1.5}
.upd li::marker{color:var(--ink-soft)}
.uitleg{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:12px;font-size:.92rem;line-height:1.55}
.uitleg li{padding-left:4px}
.uitleg li::marker{font-weight:700;color:var(--rood)}
.linkbtn{display:inline-block;background:var(--donker);color:var(--op-donker);text-decoration:none;
  border-radius:999px;padding:11px 22px;font-size:.88rem;font-weight:700}
.linkbtn:hover{filter:brightness(1.3)}
.periods::-webkit-scrollbar{display:none}
.period{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
  border-radius:999px;padding:6px 15px;cursor:pointer;font-size:.8rem;font-weight:700}
.period:hover{color:var(--ink)}
.period[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}

/* kengetallen */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px;padding-block:10px 2px;margin:0}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat.geel{border-color:var(--geel-rand)}
.stat.geel dd{color:var(--geel)}
.stat{border:0;border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden;
  padding:13px 14px;min-width:0;display:flex;flex-direction:column;gap:2px;color:#fff}
.stat::after{content:"";position:absolute;right:-26px;bottom:-26px;width:62px;height:62px;border-radius:50%;
  background:rgba(255,255,255,.12)}
.stat dt{color:inherit;opacity:.78;font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;margin:0;position:relative}
.stat dd{margin:0;font-family:var(--display);font-weight:800;font-size:1.18rem;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.15;position:relative}
.stat .sub{font-size:.7rem;opacity:.8;font-variant-numeric:tabular-nums;position:relative}
.vlak-blauw{background:#2e4057}
.vlak-rood{background:var(--alarm)}
.vlak-groen{background:#1f9e96}
.vlak-zwart{background:#22262a;color:#fff}
.vlak-geel{background:#efb13c;color:#2e2308}
.vlak-geel::after{background:rgba(0,0,0,.07)}

/* voortgang */
.progress{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:11px 13px;margin-top:8px;display:flex;flex-direction:column;gap:7px}
.progress .ptop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.progress .ptitle{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.progress .ppct{font-family:var(--display);font-weight:700;font-size:.98rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pbar{height:16px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.pbar i{display:block;height:100%}
.pbar .done{background:var(--ok)}
.pbar .open{background:var(--bad)}
.plegend{display:flex;gap:16px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.plegend span{display:inline-flex;align-items:center;gap:6px}
.plegend i{width:8px;height:8px;border-radius:50%}
.ptotal{border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;
  align-items:baseline;gap:10px;flex-wrap:wrap}
.ptotal .pt-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.ptotal .pt-sub{font-size:.74rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;width:100%}
.ptotal .pt-bedrag{font-family:var(--display);font-weight:700;font-size:1.12rem;letter-spacing:-.025em;
  font-variant-numeric:tabular-nums}

/* leveranciers */
.suppliers{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  margin-top:8px;padding:0 13px}
.suppliers summary{list-style:none;cursor:pointer;padding:11px 0;font-size:.68rem;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink-soft);display:flex;align-items:center;justify-content:space-between;gap:10px}
.suppliers summary::-webkit-details-marker{display:none}
.suppliers summary::after{content:"\25BE";font-size:.8rem;transition:transform .15s ease}
.suppliers[open] summary::after{transform:rotate(180deg)}
.suppliers table{width:100%;border-collapse:collapse;font-size:.84rem;margin-bottom:14px}
.suppliers th,.suppliers td{padding:7px 0;text-align:left;border-bottom:1px solid var(--line)}
.suppliers th{font-weight:500;color:var(--ink-soft);font-size:.68rem;text-transform:uppercase;letter-spacing:.07em}
.suppliers td.num,.suppliers th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.suppliers td.num{font-family:var(--mono);font-size:.82rem}
.suppliers td.open{color:var(--bad);font-weight:600}
.suppliers tr:last-child td{border-bottom:none}
.suppliers tr.totaalrij td{border-top:1px solid var(--line);font-weight:700;padding-top:9px}
.suppliers tr.totaalrij td.naam{font-weight:800}
.suppliers .naam{font-weight:600}

/* weergavetabs */
.tabs{display:flex;flex-wrap:wrap;gap:3px;margin-top:10px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:3px;overflow-x:visible}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 1 auto;white-space:nowrap;border:none;background:transparent;color:var(--ink-soft);
  border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:600;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .n{font-variant-numeric:tabular-nums;opacity:.6;margin-left:5px;font-weight:500}

/* prullenbak */
.trashbar{display:flex;justify-content:center;padding-bottom:22px}
.claim.is-trash{opacity:.72;border-style:dashed;background:var(--surface)}
.claim.is-trash .part{text-decoration:line-through}

/* filterbalk */
.filterbar{display:flex;align-items:center;gap:9px;padding-block:10px 0}
.filtertoggle{padding:9px 18px;font-size:.84rem;border:1.5px solid var(--line);background:var(--surface);
  color:var(--ink);box-shadow:var(--shadow)}
.filtertoggle:hover{border-color:var(--ink-soft);background:var(--surface)}
.filtertoggle[aria-expanded="true"]{background:var(--surface);color:var(--ink);border-color:var(--ink)}
.filtertoggle .fdot{background:var(--ok);width:16px;height:16px;border-radius:50%;margin-left:8px}
.filtertoggle[aria-expanded="true"]{background:var(--donker);color:var(--op-donker)}
.filtertoggle .fdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:7px;vertical-align:middle}

/* filters */
.filters{display:flex;gap:7px;flex-wrap:wrap;padding-block:8px 0;align-items:center}
.filters input[type=search],.filters select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-size:.84rem;min-width:0}
.filters input[type=search]{flex:1 1 180px}
.filterbar .lgarknop{padding:9px 18px;font-size:.84rem;border:1.5px dashed var(--rood);color:var(--rood);background:var(--surface);font-weight:700}
.filterbar .lgarknop:hover{background:var(--rood);border-color:var(--rood);color:var(--on-accent)}
@media (max-width:420px){.lgarknop{padding:9px 14px;font-size:.8rem}}
.count{color:var(--ink-soft);font-size:.8rem;margin-left:auto;font-variant-numeric:tabular-nums}

/* maandkoppen */
.maand{display:flex;flex-direction:column;gap:10px}
.maandkop{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;
  position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--kophoogte, 76px));z-index:6;background:var(--bg);
  padding-block:7px 9px;border-bottom:1px solid var(--line)}
.maandkop h2{font-family:var(--display);font-weight:800;font-size:1.04rem;margin:0;letter-spacing:-.025em}
.maandcijfers{display:flex;gap:12px;align-items:baseline;font-size:.76rem;color:var(--ink-soft);
  font-variant-numeric:tabular-nums;flex-wrap:wrap}
.maandcijfers b{font-family:var(--display);font-weight:700;font-size:.92rem;color:var(--ink);letter-spacing:-.02em}
.maandcijfers .mo{color:var(--bad);font-weight:700}
.maandcijfers .mk{color:var(--ok);font-weight:600}

/* kaarten in de stijl van een depositokaart */
.kaarten{display:flex;flex-direction:column;gap:12px}
.kaart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  cursor:pointer;position:relative;transition:border-color .14s ease}
.kaart:hover{border-color:var(--ink-soft)}
.kaart::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:transparent;z-index:1}
.kaart.k-laat::before{background:var(--rood)}
.kaart.k-uit::before{background:var(--geel-rand)}
.kaart-kop{display:flex;align-items:center;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.kaart-merk{flex:0 0 auto;width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;
  justify-content:center;font-family:var(--display);font-weight:800;font-size:.8rem;color:#fff;font-style:normal}
.kaart-titel{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:1px}
.kaart-titel h3{font-family:var(--display);font-weight:800;font-size:1.06rem;margin:0;letter-spacing:-.025em;
  overflow-wrap:anywhere;line-height:1.2}
.kaart-storing{font-size:.86rem;color:var(--ink);line-height:1.35;overflow-wrap:anywhere;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kaart-sub{font-size:.76rem;color:var(--ink-soft);margin-top:2px}
.kaart .chev{color:var(--ink-soft);font-size:.75rem;transition:transform .16s ease;flex:0 0 auto}
.kaart.k-aan .chev{transform:rotate(180deg)}
.kaart-lijf{display:flex;align-items:center;gap:14px;padding:14px 15px}
.kaart-velden{flex:1 1 auto;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.kaart-velden span{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:.72rem;color:var(--ink-soft)}
.kaart-velden b{font-family:var(--display);font-weight:700;font-size:.93rem;color:var(--ink);
  overflow-wrap:anywhere;letter-spacing:-.01em}
.kaart-velden b.geld{font-variant-numeric:tabular-nums}
.kaart-velden b.wait{color:var(--geel);font-size:.84rem}
.kaart-velden b.w-gehonoreerd{color:var(--ok)}
.kaart-velden b.w-afgewezen{color:var(--bad)}
.kaart-ring{flex:0 0 auto}
.ring{width:66px;height:66px;display:block}
.ring-bg{fill:none;stroke:var(--surface-2);stroke-width:4}
.ring-v{fill:none;stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring-t{font-family:var(--display);font-weight:800;font-size:9px;text-anchor:middle;dominant-baseline:central}
.kaart-detail{display:flex;flex-direction:column;gap:11px;padding:14px 15px 16px;border-top:1px solid var(--line);
  background:var(--surface-2);cursor:default;animation:opent .18s ease-out}
.kaart-detail .row-actions{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.kaart .aandacht{flex:0 0 auto}
@media (max-width:420px){
  .kaart-velden{grid-template-columns:1fr}
  .ring{width:56px;height:56px}
  .kaart-kop,.kaart-lijf{padding:12px 13px}
}

/* lijst */
.list{display:flex;flex-direction:column;gap:22px;padding-bottom:26px}
.claim{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);transition:border-color .15s ease, transform .15s ease;
  padding:12px 13px 12px 19px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.claim::before{content:"";position:absolute;inset:0 auto 0 0;width:9px;background:var(--edge,var(--line))}
.claim.is-gehonoreerd{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 32%,transparent)}
.claim.is-nieuw,.claim.is-ingediend{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 32%,transparent)}
.claim.is-nieuw .note,.claim.is-ingediend .note,
.claim.is-nieuw .notes,.claim.is-ingediend .notes{border-top-color:color-mix(in srgb,var(--bad) 25%,transparent)}
.claim.is-nieuw .p-neutral,.claim.is-ingediend .p-neutral{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.claim.is-nieuw .p-warn,.claim.is-ingediend .p-warn{background:color-mix(in srgb,var(--warn) 20%,transparent)}
.claim.is-nieuw .icon-btn,.claim.is-ingediend .icon-btn{border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.claim.is-uitbesteed{background:var(--geel-soft);border-color:var(--geel-rand)}
.claim.is-uitbesteed .note,.claim.is-uitbesteed .notes{border-top-color:color-mix(in srgb,var(--geel-rand) 45%,transparent)}
.claim.is-uitbesteed .p-neutral{background:color-mix(in srgb,var(--geel-rand) 22%,transparent);color:var(--geel)}
.claim.is-uitbesteed .icon-btn{border-color:color-mix(in srgb,var(--geel-rand) 55%,transparent)}
.p-geel{background:color-mix(in srgb,var(--geel-rand) 30%,transparent);color:var(--geel)}
.claim.is-gehonoreerd .note{border-top-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.claim.is-gehonoreerd .p-ok{background:color-mix(in srgb,var(--ok) 18%,transparent)}
.claim.is-gehonoreerd .p-neutral{background:color-mix(in srgb,var(--ok) 10%,transparent)}
.claim.is-gehonoreerd .icon-btn{border-color:color-mix(in srgb,var(--ok) 32%,transparent)}
.claim{cursor:pointer}
.claim .chev{position:absolute;right:14px;bottom:12px;color:var(--ink-soft);font-size:.7rem;transition:transform .15s ease;pointer-events:none}
.claim.open .chev{transform:rotate(180deg)}
.claim-sum{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--ink-soft)}
.levmark{display:inline-flex;align-items:center;gap:7px;font-weight:600;color:var(--ink);min-width:0}
.levmark i{flex:0 0 auto;width:17px;height:17px;border-radius:5px;display:inline-flex;align-items:center;
  justify-content:center;font-family:var(--display);font-weight:800;font-size:.58rem;color:#fff;
  font-style:normal;letter-spacing:0}
.claim-sum .lev{font-weight:600;color:var(--ink)}
.claim-body{display:flex;flex-direction:column;gap:8px}
.attention{display:block;font-family:var(--display);font-weight:700;font-size:.68rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--bad);margin-bottom:-3px}
.claim-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
@media (hover:hover){.claim:hover{border-color:color-mix(in srgb,var(--ink-soft) 45%,transparent)}}
.claim-head{align-items:baseline}
.part{font-family:var(--display);font-weight:700;font-size:.98rem;margin:0;min-width:0;overflow-wrap:anywhere;letter-spacing:-.015em}
.amount{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;
  font-size:1rem;letter-spacing:-.02em}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px 12px;font-size:.64rem;
  text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);min-width:0}
.meta span{display:flex;flex-direction:column;min-width:0;gap:1px}
.meta b.wait{color:var(--warn);font-family:var(--body);font-weight:600}
.meta b{font-weight:500;color:var(--ink);font-family:var(--mono);font-size:.84rem;overflow-wrap:anywhere;
  text-transform:none;letter-spacing:0}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.claim-body > .pills:last-of-type .row-actions{margin-left:0;width:100%}
.pill{font-size:.68rem;font-weight:600;letter-spacing:.03em;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-neutral{background:var(--surface-2);color:var(--ink-soft)}
.note{font-size:.84rem;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:9px;overflow-wrap:anywhere}
.notes{border-top:1px solid var(--line);padding-top:9px;display:flex;flex-direction:column;gap:7px}
.claim.is-gehonoreerd .notes{border-top-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.noteline{display:flex;gap:10px;font-size:.84rem;align-items:baseline}
.noteline .nd{color:var(--ink-soft);font-size:.72rem;white-space:nowrap;min-width:74px;font-variant-numeric:tabular-nums}
.noteline .nt{min-width:0;overflow-wrap:anywhere}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 15px;font-size:.76rem;font-weight:700;cursor:pointer;color:var(--ink-soft)}
.icon-btn:hover{color:var(--op-donker);background:var(--donker);border-color:var(--donker)}
.icon-btn.danger:hover{color:var(--bad);border-color:var(--bad)}
.icon-btn.ok{color:var(--op-donker);background:var(--ok);border-color:var(--ok);font-weight:700}
.icon-btn.ok:hover{filter:brightness(1.12);color:var(--op-donker)}
.icon-btn.warn{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.icon-btn.warn:hover{border-color:var(--bad)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:32px 20px;text-align:center;color:var(--ink-soft)}
.empty strong{display:block;font-family:var(--display);color:var(--ink);font-size:1.02rem;margin-bottom:6px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 13px;font-size:.84rem;margin-bottom:10px}
.alertbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;
  background:var(--alarm);color:var(--alarm-ink);border:1px solid var(--alarm);
  border-radius:var(--r);padding:12px 14px;font-size:.85rem;font-weight:600;
  box-shadow:0 6px 18px color-mix(in srgb,var(--alarm) 30%,transparent)}
.alertbar.done{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent);box-shadow:var(--shadow);font-weight:600}
.alertbar .ab-text{min-width:0;flex:1 1 200px}
.alertbar .ab-eyebrow{display:block;font-family:var(--display);font-weight:800;font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.alertbar strong{font-family:var(--display);font-weight:800;display:block;font-size:1.04rem;letter-spacing:-.015em}
.alertbar .ab-sub{opacity:.9;font-size:.82rem;font-variant-numeric:tabular-nums}
.alertbar button{border:2px solid currentColor;background:transparent;color:inherit;border-radius:999px;
  padding:9px 18px;font-size:.86rem;font-weight:700;cursor:pointer;white-space:nowrap}
.alertbar button:hover{background:color-mix(in srgb,currentColor 12%,transparent)}

/* formulier */
.overlay{position:fixed;inset:0;background:rgba(10,12,15,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;border:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:18px}}
.sheet h2{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0 0 16px;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.grid .full{grid-column:1/-1}
@media (max-width:420px){.grid{gap:9px}}
.grid > label.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);min-width:0;font-weight:700}
label input,label select,label textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 11px;font-size:.92rem;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink);width:100%}
label textarea{resize:vertical;min-height:54px;font-family:inherit}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:11px 24px;cursor:pointer;font-size:.88rem;font-weight:700}
.btn:hover{border-color:var(--ink)}
.btn-ghost{background:transparent}
.btn-primary{background:var(--donker);border-color:var(--donker);color:var(--op-donker);font-weight:700}
.btn-primary:hover{filter:brightness(1.3)}
.confirm{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:.85rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.85rem;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.sleepzone{position:fixed;inset:0;z-index:60;background:rgba(10,12,15,.62);display:flex;align-items:center;justify-content:center;padding:24px}
.sleepkaart{background:var(--surface);border:2px dashed var(--rood);border-radius:16px;padding:26px 30px;text-align:center;display:flex;flex-direction:column;gap:6px;max-width:430px;pointer-events:none}
.sleepkaart b{font-family:var(--display);font-size:1.05rem;letter-spacing:-.01em}
.sleepkaart span{font-size:.85rem;color:var(--ink-soft)}
.leesmelding{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--rood);border-radius:10px;padding:10px 12px;font-size:.85rem;margin:-4px 0 14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;line-height:1.45}
.linkbtn{background:none;border:0;padding:0;color:var(--rood);font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;text-decoration:underline}
label.vink{flex-direction:row;align-items:flex-start;gap:9px;text-transform:none;letter-spacing:0;font-size:.84rem;font-weight:400;color:var(--ink);line-height:1.45}
label.vink input{width:18px;height:18px;flex:0 0 auto;margin-top:2px;accent-color:var(--rood)}
.hint{font-size:.7rem;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ok)}
.ruwtekst{max-height:170px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.73rem;line-height:1.5;white-space:pre-wrap;margin:-6px 0 14px;color:var(--ink-soft)}
/* beweging: subtiel, en uit zodra het systeem daarom vraagt */
@keyframes opent{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes sheetin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.claim-body{animation:opent .18s ease-out}
.toast{animation:toastin .2s ease-out}
.sheet{animation:sheetin .22s cubic-bezier(.2,.7,.3,1)}
.overlay{animation:opent .15s ease-out}
.pbar i{transition:width .45s cubic-bezier(.2,.7,.3,1)}
.btn:active,.solid-on-brand:active,.ghost-on-brand:active,.icon-btn:active,.alertbar button:active{transform:scale(.97)}
.btn,.solid-on-brand,.ghost-on-brand,.icon-btn,.alertbar button,.period,.tab{transition:background-color .14s ease,color .14s ease,border-color .14s ease,transform .08s ease}
.claim{will-change:auto}
.chev{transition:transform .18s ease}
:focus-visible{outline:2px solid var(--rood);outline-offset:3px;border-radius:6px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===================== versie 2: aanvullingen ===================== */
:root{--grijs:#8a8f96}
:root[data-theme="dark"]{--grijs:#6f777e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--grijs:#6f777e}}
:root[data-theme="light"]{color-scheme:light}

/* toegangsscherm met e-mail */
#gate form.kaart{gap:12px}
#gate .velden{display:flex;flex-direction:column;gap:8px}
#gate button[disabled]{opacity:.6;cursor:wait}

/* weergavekeuze: claims of rapportage */
.weergave{display:flex;gap:3px;margin-top:10px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:999px;padding:3px;width:fit-content}
.weergave button{border:0;background:transparent;color:var(--ink-soft);border-radius:999px;padding:7px 16px;
  font-size:.82rem;font-weight:700;cursor:pointer}
.weergave button[aria-pressed="true"]{background:var(--donker);color:var(--op-donker)}
.weergave-rij{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.weergave-rij .sync{margin-left:auto;margin-top:10px;font-size:.72rem;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.offline i{background:var(--geel-rand)}
.sync.lokaal i{background:var(--grijs)}

/* alertbalk: tweede knop */
.alertbar .ab-knoppen{display:flex;gap:6px;flex-wrap:wrap}

/* tabs: aandacht */
.tab[data-tab="aandacht"] .n{color:var(--bad);opacity:1;font-weight:700}

/* filterbalk */
.filterbar{flex-wrap:wrap}
.selectknop[aria-pressed="true"]{background:var(--donker);color:var(--op-donker);border-color:var(--donker)}

/* selecteren */
.kaart .vinkje{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--surface);
  display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;color:transparent}
.kaart.k-sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.kaart.k-sel .vinkje{background:var(--donker);border-color:var(--donker);color:var(--op-donker)}
.bulkbalk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:35;
  width:min(720px,calc(100% - 24px));background:var(--surface);border:1px solid var(--ink);border-radius:14px;
  box-shadow:var(--zweef);padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;animation:sheetin .2s ease-out}
.bulkbalk .bb-tekst{font-size:.84rem;font-weight:700;margin-right:auto;font-variant-numeric:tabular-nums}
.bulkbalk .bb-tekst span{display:block;font-weight:500;color:var(--ink-soft);font-size:.74rem}
.bulkbalk .linkbtn{font-size:.76rem}
body.met-bulk .list{padding-bottom:110px}

/* tijdlijn in het detail */
.tijdlijn{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line);padding-top:9px}
.tl{display:grid;grid-template-columns:82px 14px 1fr;gap:0 8px;font-size:.84rem;align-items:start;padding-bottom:7px;position:relative}
.tl .nd{color:var(--ink-soft);font-size:.72rem;white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:2px}
.tl .bol{width:9px;height:9px;border-radius:50%;background:var(--ink-soft);margin-top:5px;justify-self:center;position:relative;z-index:1}
.tl:not(:last-child)::after{content:"";position:absolute;left:calc(82px + 8px + 6px);top:14px;bottom:-2px;width:1px;background:var(--line)}
.tl.s .bol{background:var(--info)}
.tl.s-gehonoreerd .bol{background:var(--ok)}
.tl.s-afgewezen .bol{background:var(--bad)}
.tl.s .nt{color:var(--ink-soft);font-weight:600}
.tl .nt{min-width:0;overflow-wrap:anywhere}
.doorloop{font-size:.8rem;color:var(--ink-soft)}
.doorloop b{color:var(--ink)}

/* waarschuwing dubbele claim */
.dubbel{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.85rem;line-height:1.45;margin-top:14px}
.dubbel b{color:var(--ink)}

/* rapportage */
.rapport{display:flex;flex-direction:column;gap:12px;padding-block:10px 30px}
.paneel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
.paneel-kop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.paneel h2{font-family:var(--display);font-weight:800;font-size:1.02rem;margin:0;letter-spacing:-.02em}
.paneel .uitleg-kort{font-size:.76rem;color:var(--ink-soft);margin:0}
.paneel table{width:100%;border-collapse:collapse;font-size:.84rem}
.paneel th,.paneel td{padding:7px 8px 7px 0;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.paneel th{font-weight:600;color:var(--ink-soft);font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.paneel td.num,.paneel th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.paneel td.num{font-family:var(--mono);font-size:.8rem}
.paneel tr:last-child td{border-bottom:0}
.paneel td.num + td:not(.num),.paneel th.num + th:not(.num){padding-left:18px}
.paneel td.open{color:var(--bad);font-weight:600}
.paneel td .klein{display:block;font-size:.72rem;color:var(--ink-soft);font-family:var(--body)}
.tabelscroll{overflow-x:auto;margin-inline:-15px;padding-inline:15px}
.tabelscroll table{min-width:640px}
.balkje{display:block;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:4px;min-width:60px}
.balkje i{display:block;height:100%;background:var(--ok);border-radius:999px}
.mailknop{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.72rem;font-weight:700;cursor:pointer;color:var(--ink);white-space:nowrap}
.mailknop:hover{background:var(--donker);color:var(--op-donker);border-color:var(--donker)}
.suppliers td .mailknop{margin-left:6px}

/* grafiek */
.grafiek{position:relative}
.grafiek svg{display:block;width:100%;height:auto;overflow:visible}
.grafiek .as{stroke:var(--line);stroke-width:1}
.grafiek .rooster{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3;opacity:.7}
.grafiek .aslabel{fill:var(--ink-soft);font-size:10.5px;font-family:var(--body);font-variant-numeric:tabular-nums}
.grafiek .waarde{fill:var(--ink);font-size:10.5px;font-weight:700;font-family:var(--body);font-variant-numeric:tabular-nums}
.grafiek .hit{fill:transparent;cursor:default}
.grafiek .kolom.dim{opacity:.45}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-soft);margin-top:8px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--zweef);
  padding:8px 10px;font-size:.78rem;min-width:180px;z-index:5;transform:translateX(-50%);white-space:nowrap}
.tip b{font-family:var(--display);display:block;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.tip .r span{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft)}
.tip .r i{width:8px;height:8px;border-radius:2px;display:inline-block}
.schakel{border:0;background:none;color:var(--rood);font-weight:700;font-size:.78rem;cursor:pointer;text-decoration:underline;padding:0}

/* mailvoorbeeld */
.mailvoorbeeld{width:100%;min-height:220px;font-family:var(--mono);font-size:.78rem;line-height:1.5;border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;background:var(--bg);color:var(--ink);resize:vertical}

/* toast met knop */
.toast{display:flex;align-items:center;gap:12px}
.toast button{border:0;background:transparent;color:inherit;font:inherit;font-weight:800;text-decoration:underline;cursor:pointer;padding:0}

@media (max-width:620px){
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:100%}
  .tab{flex:0 0 auto}
}
/* menu in groepen */
.menu-kop{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);font-weight:700;padding:9px 13px 3px}
.menu-scheiding{height:1px;background:var(--line);margin:5px 6px}
.menupaneel{min-width:210px}

/* werkbalk boven de lijst */
.werkbalk{display:flex;align-items:center;gap:8px;padding-block:10px 0;flex-wrap:wrap}
.zoekveld{flex:1 1 260px;min-width:0;position:relative}
.zoekveld input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px 9px 36px;font-size:.86rem;color:var(--ink)}
.zoekveld input:focus{border-color:var(--ink-soft);outline:none}
.zoekveld svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-soft);pointer-events:none}
.werkbalk .knoppen{display:flex;gap:8px;flex-wrap:wrap}
.werkbalk .btn{padding:9px 16px;font-size:.84rem}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-top:8px}
.filters select{flex:1 1 150px}
.lijstkop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-top:14px;font-size:.78rem;color:var(--ink-soft)}
.lijstkop b{color:var(--ink);font-weight:700}
.list{padding-top:4px}

/* knoppen op de kaart in groepen */
.kaart-detail .row-actions{align-items:center}
.kaart-detail .row-actions .tussen{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
.kaart-detail .row-actions .rechts{margin-left:auto}

/* instellingen in secties */
.sectie{grid-column:1/-1;font-family:var(--display);font-weight:800;font-size:.9rem;letter-spacing:-.01em;margin:10px 0 -2px;
  padding-top:12px;border-top:1px solid var(--line);color:var(--ink)}
.sectie:first-child{margin-top:0;padding-top:0;border-top:0}

/* afdrukken */
.printkop{display:none}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#f4f4f4}
  body{background:#fff;font-size:11px}
  body::before,.byline,.bar-tools,.periodbar,.filterbar,.filters,.tabs,.weergave-rij,.alertbar,.trashbar,.bulkbalk,.toast,.kaart .chev,
  .row-actions,.mailknop,.schakel,.sync,.kaart-ring,.banner{display:none!important}
  header.brandbar{position:static;box-shadow:none}
  .printkop{display:block;font-size:.8rem;color:#555;margin:6px 0 10px}
  .maandkop{position:static}
  .kaart,.paneel,.stat{break-inside:avoid}
  .stat{color:#000!important;background:#fff!important;border:1px solid #ccc!important}
  .kaart-lijf{padding:8px 12px}
  .kaart-kop{padding:8px 12px}
  .suppliers{display:block}
  a{color:inherit}
}

/* ===================== opzet met blokken ===================== */
:root{--blok:#ffffff;--blok-rand:var(--line);--tabbar:#22262a;--tabbar-ink:#c9ced3;--tabbar-actief:#ffffff}
:root[data-theme="dark"]{--blok:#1e2225;--tabbar:#0e1113;--tabbar-ink:#9aa2a9;--tabbar-actief:#e9ebec}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--blok:#1e2225;--tabbar:#0e1113;--tabbar-ink:#9aa2a9;--tabbar-actief:#e9ebec}}
main.app{max-width:860px;margin-inline:auto;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
header.brandbar .brandbar-inner{max-width:860px;margin-inline:auto}
header .sync{margin-left:auto;font-size:.72rem;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
@media (max-width:520px){header .sync .sync-tekst{display:none}}

/* zoeken en periodes */
.app > .zoekveld{margin-top:12px}
.zoekveld{position:relative}
.zoekveld input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 15px 12px 40px;font-size:.95rem;color:var(--ink)}
.zoekveld input:focus{border-color:var(--ink-soft);outline:none}
.zoekveld svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-soft);pointer-events:none}
.app > .periods{padding-block:10px 0;margin-inline:-2px}
.period{padding:5px 13px;font-size:.78rem}

/* tellerstrook */
.teller{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:16px;
  margin-top:12px;overflow:hidden}
.teller button{border:0;background:transparent;padding:13px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
  position:relative;color:var(--ink-soft);min-width:0}
.teller button + button::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:1px;background:var(--line)}
.teller b{font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.teller .tl-label{font-size:.72rem;font-weight:600}
.teller .tl-sub{font-size:.66rem;font-variant-numeric:tabular-nums;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.teller button[data-tab="open"] b{color:var(--info)}
.teller button[data-tab="aandacht"].heeft b{color:var(--rood)}
.teller button[data-tab="afgehandeld"] b{color:var(--ok)}
.teller button[aria-selected="true"]{background:var(--surface-2);color:var(--ink)}
.teller button[aria-selected="true"]::after{content:"";position:absolute;left:24%;right:24%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--rood)}

/* kop boven de lijst */
.lijstkop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 2px 4px;flex-wrap:nowrap}
.lk-titel{min-width:0;overflow:hidden;white-space:nowrap}
.lk-knoppen{flex:0 0 auto}
@media (max-width:420px){.lijstkop .lk-bedrag{display:none}}
.lk-titel{display:inline-flex;align-items:center;gap:8px;font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.lk-titel i{width:7px;height:7px;border-radius:50%;background:var(--info);display:inline-block}
.lk-titel .lk-bedrag{letter-spacing:0;text-transform:none;font-weight:600;font-variant-numeric:tabular-nums}
.lk-knoppen{display:flex;gap:6px}
.klein-knop{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:.76rem;font-weight:700;cursor:pointer}
.klein-knop:hover{border-color:var(--ink-soft)}
.klein-knop[aria-pressed="true"],.klein-knop[aria-expanded="true"]{background:var(--donker);border-color:var(--donker);color:var(--op-donker)}
.klein-knop .fdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--rood);margin-left:6px;vertical-align:middle}
.filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px}
.filters select{flex:1 1 150px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:.82rem;min-width:0}

/* groepen en blokken */
.list{display:flex;flex-direction:column;gap:18px;padding-top:6px;padding-bottom:10px}
.groep{display:flex;flex-direction:column;gap:8px}
.groepkop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 2px 0;font-size:.7rem;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.groepkop .gk-titel{display:inline-flex;align-items:center;gap:8px}
.groepkop .gk-titel i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.groepkop.heeft-open .gk-titel i{background:var(--info)}
.groepkop.heeft-laat .gk-titel i{background:var(--rood)}
.groepkop .gk-cijfers{letter-spacing:0;text-transform:none;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.groepkop .gk-cijfers .mo{color:var(--bad)}
.blok{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--blok);border:1px solid var(--blok-rand);border-radius:16px;
  padding:12px 12px 12px 12px;cursor:pointer;color:var(--ink);position:relative;transition:border-color .14s ease, transform .08s ease}
.blok:hover{border-color:var(--ink-soft)}
.blok:active{transform:scale(.99)}
.blok.k-laat{border-color:color-mix(in srgb,var(--rood) 45%,var(--line))}
.blok.k-sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.blok-icoon{flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:800;font-size:.82rem;color:var(--lev);background:color-mix(in srgb,var(--lev) 15%,transparent)}
.blok.k-sel .blok-icoon,.blok .blok-icoon.vink{background:var(--donker);color:var(--op-donker);font-size:1rem}
.blok-tekst{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.blok-tekst b{font-family:var(--display);font-weight:700;font-size:.98rem;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blok-tekst span{font-size:.78rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blok-tekst .wacht{color:var(--geel)}
.blok-rechts{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.blok-sub{font-size:.76rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.blok-sub .laat{color:var(--rood);font-weight:700}
.blok .chev{flex:0 0 auto;color:var(--ink-soft);font-size:1.1rem;line-height:1;margin-left:-2px}
.statuspil{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:700;white-space:nowrap}
.sp-nieuw{background:var(--surface-2);color:var(--ink-soft)}
.sp-ingediend{background:var(--info-soft);color:var(--info)}
.sp-gehonoreerd{background:var(--ok-soft);color:var(--ok)}
.sp-afgewezen{background:var(--bad-soft);color:var(--bad)}
.sp-uitbesteed{background:var(--geel-soft);color:var(--geel)}
@media (max-width:420px){
  .blok{gap:10px;padding:11px 10px}
  .blok-icoon{width:40px;height:40px;border-radius:11px}
  .blok .chev{display:none}
}

/* detailvenster */
.detail-kop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.detail-kop .blok-icoon{width:48px;height:48px}
.detail-kop h2{margin:0!important}
.detail-kop .dk-sub{font-size:.84rem;color:var(--ink-soft)}
.detail-bedrag{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.detail-bedrag .db-bedrag{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.detail-bedrag .db-bedrag.wait{font-size:1rem;color:var(--geel)}
.detail-bedrag .db-pillen{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.detail .meta{margin-bottom:12px}
.detail .storing{font-size:.92rem;line-height:1.45;margin:0 0 10px;overflow-wrap:anywhere}
.detail .doorloop{display:block;margin-bottom:10px}
.detail .note{margin:0 0 10px}
.detail .tijdlijn{margin-bottom:6px}
.detail .row-actions{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0;align-items:center}
.detail .row-actions .tussen{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
.detail .row-actions .rechts{margin-left:auto}
.detail .confirm{margin-top:10px}

/* onderbalk */
.onderbalk{position:fixed;left:0;right:0;bottom:0;z-index:30;pointer-events:none;
  padding:0 max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:linear-gradient(to top,var(--bg) 55%,color-mix(in srgb,var(--bg) 0%,transparent))}
.onderbalk > *{pointer-events:auto}
.actieknoppen{display:flex;gap:8px;width:min(560px,100%);padding-top:14px}
.grote-knop{flex:1 1 auto;border:0;border-radius:16px;background:var(--rood);color:#fff;font-family:var(--display);font-weight:700;font-size:1rem;
  padding:14px 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 8px 22px color-mix(in srgb,var(--rood) 35%,transparent)}
.grote-knop .plus{display:inline-flex;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.22);align-items:center;justify-content:center;font-size:1rem;line-height:1}
.grote-knop:hover{filter:brightness(1.06)}
.lgar-knop{flex:0 0 auto;border:1.5px dashed var(--rood);border-radius:16px;background:var(--surface);color:var(--rood);font-weight:800;font-size:.86rem;padding:0 18px;cursor:pointer}
.lgar-knop:hover{background:var(--rood);color:#fff;border-style:solid}
.tabbar{display:flex;gap:4px;background:var(--tabbar);border-radius:999px;padding:5px;box-shadow:var(--zweef)}
.tabbar button{border:0;background:transparent;color:var(--tabbar-ink);border-radius:999px;padding:7px 16px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:.68rem;font-weight:700;cursor:pointer;min-width:84px}
.tabbar button svg{width:20px;height:20px}
.tabbar button[aria-pressed="true"]{background:color-mix(in srgb,#fff 12%,transparent);color:var(--tabbar-actief)}
.tabbar button[aria-pressed="true"] svg{color:var(--rood)}
.tabbar button:hover{color:var(--tabbar-actief)}
.tabbar .menu{position:relative}
.tabbar .menupaneel{top:auto;bottom:calc(100% + 12px);right:-5px}
.menu-voet{display:block;font-size:.66rem;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase;padding:8px 13px 4px;border-top:1px solid var(--line);margin-top:5px}
.menu-voet b{color:var(--rood)}
.onderbalk .bulkbalk{position:static;transform:none;width:min(560px,100%);margin-top:14px;animation:none}
body.met-bulk .actieknoppen{display:none}
.toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.trashbar{padding-top:8px}
@media print{ .onderbalk,.zoekveld,.app > .periods,.teller,.lijstkop,.filters{display:none!important} main.app{padding-bottom:0} }

/* navigatie bovenaan */
.topnav{max-width:860px;margin-inline:auto;padding-bottom:10px}
.topnav .tabbar{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:none}
.topnav .tabbar > button,.topnav .tabbar .menu{flex:1 1 0}
.topnav .tabbar button{flex-direction:row;justify-content:center;gap:8px;min-width:0;width:100%;padding:9px 10px;border-radius:10px;
  font-size:.86rem;color:var(--ink-soft)}
.topnav .tabbar button svg{width:18px;height:18px}
.topnav .tabbar button:hover{color:var(--ink)}
.topnav .tabbar button[aria-pressed="true"]{background:var(--donker);color:var(--op-donker)}
.topnav .tabbar button[aria-pressed="true"] svg{color:var(--rood)}
.topnav .tabbar button[aria-expanded="true"]{background:var(--surface);color:var(--ink)}
.topnav .menupaneel{top:calc(100% + 8px);bottom:auto;right:0}
main.app{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.onderbalk{background:linear-gradient(to top,var(--bg) 45%,color-mix(in srgb,var(--bg) 0%,transparent))}
@media print{.topnav{display:none!important}}
.tabbar .menupaneel .menu-item{display:block;width:100%;min-width:0;text-align:left;justify-content:flex-start;flex-direction:row;
  color:var(--ink);font-size:.87rem;font-weight:600;padding:10px 13px;border-radius:9px;background:transparent}
.tabbar .menupaneel .menu-item:hover{background:var(--surface-2);color:var(--ink)}

/* Claim toevoegen bovenaan, onder de navigatie */
main.app > .actieknoppen{width:100%;padding-top:14px}
main.app > .actieknoppen .grote-knop{box-shadow:none}
main.app{padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
body.met-bulk main.app{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.onderbalk{background:none}
.onderbalk .bulkbalk{margin-top:0}
.toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
body.met-bulk .toast{bottom:calc(110px + env(safe-area-inset-bottom,0px))}
@media print{main.app > .actieknoppen{display:none!important}}

.topnav .menupaneel{left:0;right:auto}

.lgar-knop{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;font-family:var(--display);font-size:.92rem}
.lgar-knop .plus{display:inline-flex;width:20px;height:20px;border-radius:50%;background:color-mix(in srgb,var(--rood) 14%,transparent);align-items:center;justify-content:center;font-size:.9rem;line-height:1}
.lgar-knop:hover .plus{background:rgba(0,0,0,.2)}
@media (max-width:420px){
  .actieknoppen .grote-knop{font-size:.92rem;padding:13px 12px;gap:8px}
  .actieknoppen .lgar-knop{padding:0 12px;font-size:.84rem;gap:6px}
}

/* LGAR keuze */
.lgarkeuze .keuze{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);
  border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;color:var(--ink)}
.lgarkeuze .keuze:hover{border-color:var(--rood)}
.lgarkeuze .keuze b{font-family:var(--display);font-size:1rem}
.lgarkeuze .keuze span{font-size:.84rem;color:var(--ink-soft);line-height:1.4}

/* tijdlijn: wie */
.tl .tl-wie{color:var(--ink-soft);font-weight:500;white-space:nowrap}
/* vegen */
.blok-wrap{position:relative;border-radius:16px;overflow:hidden;background:var(--surface-2)}
.blok-acties{position:absolute;top:0;bottom:0;right:0;display:flex;visibility:hidden}
.blok-wrap:has(.blok.sleep) .blok-acties,.blok-wrap:has(.blok.open) .blok-acties{visibility:visible}
.blok-wrap{background:transparent}
.blok-wrap:has(.blok.sleep),.blok-wrap:has(.blok.open){background:var(--surface-2)}
.blok-acties .va{border:0;width:92px;color:#fff;font-weight:800;font-size:.8rem;cursor:pointer;padding:0 6px}
.va-ok{background:var(--ok)}
.va-bad{background:var(--bad)}
.va-info{background:var(--info)}
.blok-wrap .blok{position:relative;z-index:1;touch-action:pan-y;transition:transform .22s cubic-bezier(.2,.7,.3,1),border-color .14s ease}
.blok-wrap .blok.sleep{transition:none}
.blok-wrap .blok.open{border-top-right-radius:0;border-bottom-right-radius:0}
@media (max-width:420px){.blok-acties .va{width:82px;font-size:.76rem}}

/* dagelijkse melding */
.dagmelding{display:flex;align-items:center;gap:12px;margin-top:12px;background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);
  border-radius:16px;padding:12px 12px 12px 14px;animation:opent .2s ease-out}
.dm-icoon{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--rood);color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.dm-tekst{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:.84rem;color:var(--ink-soft)}
.dm-tekst b{color:var(--bad);font-family:var(--display);font-size:.95rem}
.dm-knoppen{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.dm-weg{border:0;background:transparent;color:var(--ink-soft);font-size:1.4rem;line-height:1;cursor:pointer;padding:2px 6px}

/* ===== inlogscherm ===== */
#gate{display:block;overflow-y:auto;padding:0;background:var(--bg)}
#gate .gate-streep{display:flex;height:8px}
#gate .gate-streep i{display:block;height:100%}
#gate .gate-streep i:nth-child(1){flex:0 0 10%;background:#f7cbd1}
#gate .gate-streep i:nth-child(2){flex:0 0 10%;background:#5fc4c0}
#gate .gate-streep i:nth-child(3){flex:0 0 10%;background:#2e4057}
#gate .gate-streep i:nth-child(4){flex:0 0 11%;background:#efb13c}
#gate .gate-streep i:nth-child(5){flex:1 1 auto;background:var(--rood)}
#gate .gate-inhoud{max-width:400px;margin:0 auto;padding:clamp(28px,8vh,72px) max(20px,env(safe-area-inset-left,0px)) 40px;
  display:flex;flex-direction:column;align-items:center;text-align:center}
#gate .gate-icoon{width:84px;height:84px;border-radius:22px;box-shadow:0 10px 26px color-mix(in srgb,var(--rood) 30%,transparent);margin-bottom:18px}
#gate .merk{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:-.03em;color:var(--rood);line-height:1}
#gate h1{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.03em;margin:6px 0 2px;color:var(--ink)}
#gate .gate-vest{margin:0 0 22px;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
#gate .gate-kaart{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 18px;
  display:flex;flex-direction:column;gap:12px;text-align:left;box-shadow:0 12px 32px rgba(34,38,42,.06)}
#gate .gate-uitleg{margin:0 0 2px;font-size:.88rem;color:var(--ink-soft);line-height:1.45}
#gate .gate-veld{position:relative;display:block;text-transform:none;letter-spacing:0;font-weight:400}
#gate .gate-veld > svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-soft);pointer-events:none}
#gate .gate-veld input{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 48px 14px 44px;
  font-size:1rem;color:var(--ink);text-align:left}
#gate .gate-veld input:focus{outline:none;border-color:var(--rood);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--rood) 14%,transparent)}
#gate .gate-oog{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--ink-soft);
  width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
#gate .gate-oog svg{width:19px;height:19px}
#gate .gate-oog[aria-pressed="true"]{color:var(--rood)}
#gate .gate-knop{width:100%;margin-top:4px;box-shadow:0 8px 22px color-mix(in srgb,var(--rood) 30%,transparent)}
#gate .fout{color:var(--bad);font-size:.84rem;font-weight:600;background:var(--bad-soft);border-radius:10px;padding:9px 12px}
#gate .gate-tip{margin:18px 0 0;font-size:.8rem;color:var(--ink-soft)}
#gate .gate-voet{margin-top:26px;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
#gate .gate-voet b{color:var(--rood)}
@keyframes schud{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
#gate .gate-kaart.schud{animation:schud .45s ease}

/* rode knop in beide thema's dezelfde, goed leesbare kleur */
.grote-knop{background:#d9342a}
.grote-knop:hover{background:#c52e25;filter:none}

/* ===== inlogscherm in Medipoint-stijl (altijd donker) ===== */
#gate{--g-bg:#1b1e21;--g-kaart:#22262a;--g-lijn:#3a4148;--g-tekst:#eef0f1;--g-zacht:#9aa3ab;
  background:radial-gradient(120% 70% at 50% 0%,#2a2f34 0%,var(--g-bg) 60%);color:var(--g-tekst);color-scheme:dark}
#gate .gate-inhoud{padding-top:clamp(36px,10vh,90px)}
#gate .gate-embleem{width:118px;height:118px;margin-bottom:18px;filter:drop-shadow(0 12px 28px rgba(217,52,42,.35))}
#gate .merk{color:#ff5a4c;font-size:2rem;letter-spacing:-.04em}
#gate h1{color:var(--g-zacht);font-weight:600;font-size:1.35rem;letter-spacing:-.01em;margin:2px 0 4px}
#gate .gate-vest{color:var(--g-zacht);opacity:.8;margin-bottom:30px}
#gate .gate-kaart{background:transparent;border:0;box-shadow:none;padding:0;gap:14px}
#gate .gate-uitleg{color:var(--g-zacht);text-align:center}

#gate .gate-veld input{background:transparent;border:1.5px solid var(--g-lijn);color:var(--g-tekst);border-radius:12px}
#gate .gate-veld input::placeholder{color:#7d868e}
#gate .gate-veld input:focus{background:rgba(255,255,255,.03);border-color:#ff5a4c;box-shadow:0 0 0 4px rgba(255,90,76,.16)}
#gate .gate-oog{color:var(--g-zacht)}
#gate .gate-oog[aria-pressed="true"]{color:#ff5a4c}
#gate .gate-rij{display:flex;align-items:center;gap:14px;margin-top:4px}
#gate .gate-rij .gate-knop{flex:0 0 auto;width:auto;min-width:46%;margin:0;border-radius:12px;padding:14px 22px}
#gate .gate-vergeten{flex:1 1 auto;border:0;background:transparent;color:var(--g-zacht);font-size:.86rem;font-weight:600;cursor:pointer;text-align:right;padding:8px 0}
#gate .gate-vergeten:hover,#gate .gate-vergeten[aria-expanded="true"]{color:var(--g-tekst)}
#gate .gate-tip{margin:0;background:rgba(255,255,255,.05);border:1px solid var(--g-lijn);border-radius:12px;padding:10px 12px;color:var(--g-zacht);text-align:left;font-size:.84rem;line-height:1.45}
#gate .gate-tweede{width:100%;margin-top:10px;border:1.5px solid var(--g-lijn);background:rgba(255,255,255,.04);color:var(--g-tekst);
  border-radius:12px;padding:13px 18px;font-family:var(--display);font-weight:700;font-size:.95rem;cursor:pointer}
#gate .gate-tweede:hover{border-color:var(--g-zacht)}
#gate .fout{background:rgba(255,90,76,.12);color:#ff8a7f}
#gate .gate-voet{color:var(--g-zacht);margin-top:34px}
#gate .gate-voet b{color:#ff5a4c}
.overlay{z-index:1000}
.toast{z-index:1001}

/* ===================== computer: zijbalk en tabel ===================== */
.claimtabel{width:100%;border-collapse:separate;border-spacing:0;font-size:.88rem}
.tabelkader{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.claimtabel th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-soft);padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
.claimtabel th i{font-style:normal;margin-left:5px;opacity:.45;font-size:.7rem}
.claimtabel th.actief{color:var(--ink)}
.claimtabel th.actief i{opacity:1;color:var(--rood)}
.claimtabel th:hover{color:var(--ink)}
.claimtabel th:last-child{cursor:default;width:28px}
.claimtabel td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink)}
.claimtabel tbody tr:last-child td{border-bottom:0}
.claimtabel tr[data-card]{cursor:pointer;transition:background .1s ease}
.claimtabel tr[data-card]:hover td{background:var(--surface-2)}
.claimtabel tr[data-card]:focus-visible{outline:2px solid var(--rood);outline-offset:-2px}
.claimtabel tr.k-laat td:first-child{box-shadow:inset 3px 0 0 var(--rood)}
.claimtabel tr.k-sel td{background:color-mix(in srgb,var(--info) 10%,transparent)}
.claimtabel .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.claimtabel th.num{text-align:right}
.claimtabel .mono{font-family:var(--mono);font-size:.82rem}
.claimtabel .klein{display:block;font-size:.74rem;color:var(--ink-soft);max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.claimtabel .wacht{color:var(--geel);font-family:var(--body);font-size:.8rem}
.claimtabel .laat{color:var(--rood);font-weight:800}
.claimtabel .t-titel{display:flex;align-items:center;gap:11px;min-width:240px}
.claimtabel .t-titel .blok-icoon{width:34px;height:34px;border-radius:9px;font-size:.7rem}
.claimtabel .t-titel b{display:block;font-weight:700}
.claimtabel .t-pijl{color:var(--ink-soft);font-size:1.1rem;text-align:right}
.claimtabel .t-vink{width:36px}
.claimtabel .vinkje{display:inline-flex;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);align-items:center;justify-content:center;font-size:.75rem;font-weight:800}
.claimtabel tr.k-sel .vinkje{background:var(--donker);border-color:var(--donker);color:var(--op-donker)}
.claimtabel .t-groep td{background:var(--bg);padding:9px 12px;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);cursor:default}
.claimtabel .t-groep td{display:table-cell}
.claimtabel .t-groep span + span{float:right;letter-spacing:0;text-transform:none;font-weight:600}
.claimtabel .t-groep .mo{color:var(--bad)}

/* ===== computer en telefoon gelijk + verbeteringen ===== */
.sorteer-rij{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin-bottom:-6px}
.sorteer-rij::-webkit-scrollbar{display:none}

  --ok:#4fc9bd; --ok-soft:rgba(79,201,189,.13);
  --warn:#e8b45a; --warn-soft:rgba(232,180,90,.13);
  --geel:#efc375; --geel-soft:rgba(239,177,60,.13); --geel-rand:#c8963a;
